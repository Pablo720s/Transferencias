<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tamales Lucy - Laboratorio de Animación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #fbfaf8;
      --card-bg: #f3f1ed;
      --input-bg: #352c22;
      --ink: #0f0f0f;
      --espresso: #352c22;
      --spring: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-page);
      font-family: 'Inter', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* ==========================================================================
       1. PANTALLA DE BIENVENIDA (SPLASH IDÉNTICO A LA IMAGEN)
       ========================================================================== */
    .splash-screen {
      position: fixed;
      inset: 0;
      background-color: #ffffff;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding-top: 38vh;
      padding-bottom: 0;
      transition: opacity 0.75s var(--spring), visibility 0.75s;
    }

    .splash-screen.hidden-splash {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-titles {
      text-align: center;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUpSoft 0.8s var(--spring) 0.1s forwards;
    }

    .splash-welcome {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 23px;
      letter-spacing: 0.02em;
      color: #26211d;
      margin-bottom: 6px;
    }

    .splash-brand {
      font-family: 'Alex Brush', cursive;
      font-weight: 400;
      font-size: 62px;
      line-height: 1.05;
      color: #35291f;
    }

    .splash-tamales-wrap {
      width: 270px;
      height: 295px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      transform: translateY(14px);
      animation: fadeUpSoft 0.85s var(--spring) 0.22s forwards;
    }

    @keyframes fadeUpSoft {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Humo animado idéntico al trazo */
    .smoke-line {
      stroke-dasharray: 90;
      stroke-dashoffset: 90;
      animation: smokeFlow 2.2s ease-in-out infinite;
    }
    .smoke-line.s1 { animation-delay: 0.1s; }
    .smoke-line.s2 { animation-delay: 0.35s; }
    .smoke-line.s3 { animation-delay: 0.6s; }

    @keyframes smokeFlow {
      0% {
        stroke-dashoffset: 90;
        opacity: 0;
        transform: translateY(4px);
      }
      25% {
        opacity: 1;
      }
      65% {
        stroke-dashoffset: 0;
        opacity: 1;
        transform: translateY(-2px);
      }
      100% {
        stroke-dashoffset: -90;
        opacity: 0;
        transform: translateY(-7px);
      }
    }

    /* ==========================================================================
       2. ESCENARIO DE LOGIN Y PERSONAJE INTERACTIVO
       ========================================================================== */
    .login-stage {
      width: 100%;
      max-width: 410px;
      padding: 16px 22px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.7s var(--spring), transform 0.7s var(--spring);
    }

    .login-stage.ready {
      opacity: 1;
      transform: translateY(0);
    }

    .character-wrapper {
      width: 320px;
      height: 225px;
      margin-bottom: -14px;
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      pointer-events: none;
    }

    .character-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Transiciones suaves de las articulaciones */
    #char-head-group {
      transform-origin: 180px 92px;
      transition: transform 0.42s var(--spring);
    }

    #arm-wave-group {
      transform-origin: 122px 118px;
      transition: opacity 0.25s ease, transform 0.45s var(--spring);
    }

    #arm-idle-left {
      transition: opacity 0.25s ease;
    }

    #arm-coffee-idle {
      transform-origin: 215px 150px;
      transition: opacity 0.22s ease, transform 0.42s var(--spring);
    }

    #arm-coffee-sip {
      transform-origin: 210px 132px;
      opacity: 0;
      transform: translate(8px, 24px) rotate(16deg) scale(0.95);
      transition: opacity 0.22s ease, transform 0.45s var(--spring);
    }

    /* Animación de saludo al entrar (00:00 - 00:02 del video) */
    .is-waving #arm-wave-group {
      opacity: 1;
      animation: waveHello 1.25s ease-in-out infinite;
    }
    .is-waving #arm-idle-left {
      opacity: 0;
    }
    .not-waving #arm-wave-group {
      opacity: 0;
      transform: translate(16px, 26px) rotate(-18deg);
      pointer-events: none;
    }
    .not-waving #arm-idle-left {
      opacity: 1;
    }

    @keyframes waveHello {
      0%, 100% { transform: rotate(0deg); }
      35% { transform: rotate(9deg) translateY(-3px); }
      70% { transform: rotate(-6deg) translateY(2px); }
    }

    /* Estado tomando café cuando se toca el campo PIN (00:04 - 00:06 del video) */
    .is-sipping #char-head-group {
      transform: translate(-3px, 2px) rotate(-13deg) !important;
    }
    .is-sipping #arm-coffee-idle {
      opacity: 0;
      transform: translate(-10px, -24px) rotate(-18deg);
    }
    .is-sipping #arm-coffee-sip {
      opacity: 1;
      transform: translate(0px, 0px) rotate(0deg) scale(1);
    }

    /* ==========================================================================
       3. CAJA DE REGISTRO Y BOTONES IDÉNTICOS AL VIDEO
       ========================================================================== */
    .register-card {
      width: 100%;
      background-color: var(--card-bg);
      border-radius: 26px;
      padding: 23px 22px;
      box-shadow:
        0 20px 38px -12px rgba(42, 33, 24, 0.16),
        0 4px 12px rgba(42, 33, 24, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.85);
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      z-index: 2;
    }

    .dark-pill-input {
      width: 100%;
      height: 58px;
      background-color: var(--input-bg);
      border: none;
      border-radius: 17px;
      padding: 0 22px;
      color: #f5f2eb;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 300;
      outline: none;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .dark-pill-input::placeholder {
      color: #e4dfd7;
      opacity: 0.92;
      font-weight: 300;
    }

    .dark-pill-input:focus {
      transform: scale(1.008);
      box-shadow: 0 0 0 2px rgba(53, 44, 34, 0.22), inset 0 2px 4px rgba(0, 0, 0, 0.25);
    }

    .workers-title {
      margin-top: 38px;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 31px;
      font-weight: 500;
      color: #554c46;
      letter-spacing: 0.01em;
      background: none;
      border: none;
      cursor: pointer;
    }

    .workers-footer {
      margin-top: 64px;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 14px;
      color: #6d655e;
      letter-spacing: 0.02em;
      background: none;
      border: none;
    }
  </style>
</head>
<body>

  <!-- 1. PANTALLA DE BIENVENIDA CON PLATO DE TAMALES Y HUMO ANIMADO -->
  <div id="splash-screen" class="splash-screen">
    <div class="splash-titles">
      <p class="splash-welcome">Bienvenid@ a</p>
      <h1 class="splash-brand">Tamales Lucy</h1>
    </div>

    <div class="splash-tamales-wrap">
      <svg viewBox="0 0 300 330" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Humo animado (3 líneas onduladas idénticas) -->
        <path class="smoke-line s1" d="M128 118 C122 104, 120 92, 125 81 C130 70, 126 60, 123 52" stroke="#0f0f0f" stroke-width="3.2" stroke-linecap="round"/>
        <path class="smoke-line s2" d="M148 106 C154 90, 136 74, 140 56 C144 40, 152 32, 149 23" stroke="#0f0f0f" stroke-width="3.2" stroke-linecap="round"/>

        <!-- Tamal izquierdo inferior -->

        <path d="M106 177 C116 172, 128 168, 138 165" stroke="#0f0f0f" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M108 184 C118 179, 130 175, 142 171" stroke="#0f0f0f" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M124 191 C121 182, 123 173, 130 166" stroke="#0f0f0f" stroke-width="2" stroke-linecap="round"/>

        <!-- Amarre doble del tamal derecho -->

        <!-- Líneas de hoja de maíz tamal derecho -->

        <path d="M183 159 L205 149 M187 166 L209 156 M190 173 L208 164" stroke="#0f0f0f" stroke-width="1.8" stroke-linecap="round"/>

        <path d="M157 134 L179 125 M161 140 L183 131 M165 146 L183 138" stroke="#0f0f0f" stroke-width="1.8" stroke-linecap="round"/>
        <!-- Amarre y moño tamal superior -->
        <path d="M146 131 C153 139, 158 149, 160 159" stroke="#0f0f0f" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M151 129 C158 137, 163 147, 165 157" stroke="#0f0f0f" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M142 135 C148 134, 154 135, 161 131 M151 126 C152 133, 151 140, 148 146" stroke="#0f0f0f" stroke-width="2.3" stroke-linecap="round"/>

        <!-- Plato inclinado -->
        <path d="M84 185 C77 195, 99 212, 150 212 C198 212, 229 190, 222 173 C218 166, 211 163, 204 163" stroke="#0f0f0f" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M84 185 C89 178, 95 175, 101 174" stroke="#0f0f0f" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M98 202 C112 217, 147 221, 178 213 C196 208, 209 198, 214 188" stroke="#0f0f0f" stroke-width="2.8" stroke-linecap="round"/>

        <!-- Mano sosteniendo el plato -->
        <path d="M107 210 C110 218, 121 221, 134 222 C136 229, 138 242, 139 258" stroke="#0f0f0f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M154 233 C158 225, 164 218, 174 214" stroke="#0f0f0f" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M204 200 C205 206, 200 213, 189 216 C181 218, 175 222, 170 232 C166 240, 165 250, 165 258" stroke="#0f0f0f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

    </div>
  </div>

  <!-- 2. CONTENEDOR PRINCIPAL DE INICIO DE SESIÓN CON EL PERSONAJE DEL VIDEO -->
  <main id="login-stage" class="login-stage">
    
    <!-- Personaje idéntico al video -->
    <div id="character-container" class="character-wrapper is-waving">
      <svg class="character-svg" viewBox="0 0 320 230" fill="none" xmlns="http://www.w3.org/2000/svg">
        
        <!-- GRUPO 1: Brazo izquierdo saludando (activo al abrir, como en 00:00 - 00:02) -->
        <g id="arm-wave-group">
          <!-- Manga amplia extendida hacia la izquierda -->
          <path d="M126 98 C98 112, 82 146, 56 170 C47 177, 36 181, 31 184 C32 194, 37 204, 43 211 C68 206, 98 188, 122 162" fill="#fbfaf8" stroke="#0f0f0f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- Puño de la manga -->
          <path d="M31 184 C27 186, 26 196, 30 205 C33 211, 39 213, 43 211" fill="#fbfaf8" stroke="#0f0f0f" stroke-width="2.8" stroke-linecap="round"/>
          <!-- Mano abierta saludando -->
          <path d="M30 186 C23 181, 17 178, 14 181 C12 183, 16 187, 23 190" fill="#fbfaf8" stroke="#0f0f0f" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M23 190 C13 188, 5 189, 4 192 C4 195, 12 197, 22 197" fill="#fbfaf8" stroke="#0f0f0f" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M21 197 C11 197, 4 199, 4 202 C5 205, 13 205, 23 203" fill="#fbfaf8" stroke="#0f0f0f" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M22 203 C13 204, 7 206, 8 209 C9 211, 17 210, 26 207" fill="#fbfaf8" stroke="#0f0f0f" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M25 207 C18 209, 14 212, 16 214 C18 216, 26 213, 32 209" fill="#fbfaf8" stroke="#0f0f0f" stroke-width="2.4" stroke-linecap="round"/>
        </g>

        <!-- GRUPO 2: Torso y hombro izquierdo en reposo (00:03 - 00:07) -->
        <g id="torso-base">
          <!-- Cuerpo del suéter -->
          <path d="M124 98 C138 92, 152 90, 180 90 C208 90, 222 95, 234 106 C250 122, 262 158, 266 218 L108 218 C110 175, 114 135, 124 98 Z" fill="#fbfaf8"/>
          <!-- Hombro y manga izquierda bajada (visible cuando termina de saludar) -->
          <g id="arm-idle-left">
            <path d="M126 98 C108 112, 92 152, 80 218 L116 218 C120 185, 124 158, 127 142" fill="#fbfaf8" stroke="#0f0f0f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
          <!-- Líneas laterales del torso y cuello del suéter -->
          <path d="M125 98 C142 91, 156 90, 165 90" stroke="#0f0f0f" stroke-width="3" stroke-linecap="round"/>
          <path d="M196 90 C212 92, 225 97, 235 107 C251 124, 261 160, 265 218" stroke="#0f0f0f" stroke-width="3" stroke-linecap="round"/>
          <path d="M122 160 C120 180, 118 200, 117 218" stroke="#0f0f0f" stroke-width="3" stroke-linecap="round"/>
          <!-- Cuello redondo del suéter -->
          <path d="M159 90 C166 104, 194 104, 200 90" stroke="#0f0f0f" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- GRUPO 3: Cabeza y cuello (gira siguiendo el texto e inclina al beber en PIN) -->
        <g id="char-head-group">
          <!-- Cuello -->
          <path d="M172 72 L170 92 C174 99, 187 99, 191 92 L188 72 Z" fill="#fbfaf8" stroke="#0f0f0f" stroke-width="2.8" stroke-linejoin="round"/>
          <!-- Cabello bob negro trasero/lateral -->
          <path d="M180 20 C158 20, 146 35, 146 55 C146 67, 153 76, 165 78 L195 78 C207 76, 214 67, 214 55 C214 35, 202 20, 180 20 Z" fill="#0f0f0f"/>
          <!-- Rostro limpio sin ojos (idéntico al video) -->
          <path d="M180 31 C174 39, 164 43, 159 44 C158 58, 164 76, 180 76 C196 76, 202 58, 201 44 C196 43, 186 39, 180 31 Z" fill="#fbfaf8" stroke="#0f0f0f" stroke-width="2.6" stroke-linejoin="round"/>
        </g>

        <!-- GRUPO 4: Brazo derecho sosteniendo el vaso abajo (estado normal) -->
        <g id="arm-coffee-idle">
          <!-- Pliegues del brazo derecho -->
          <path d="M225 138 C236 155, 244 176, 240 208" stroke="#0f0f0f" stroke-width="3" stroke-linecap="round"/>
          <path d="M204 175 C216 177, 228 184, 236 196" stroke="#0f0f0f" stroke-width="2.8" stroke-linecap="round"/>

          <!-- Vaso de café con tapa y manga térmica -->
          <g transform="translate(166, 128) rotate(-5)">
            <!-- Cuerpo inferior del vaso -->
            <path d="M8 22 L13 68 C14 71, 34 71, 35 68 L40 22 Z" fill="#fbfaf8" stroke="#0f0f0f" stroke-width="2.6" stroke-linejoin="round"/>
            <!-- Manga protectora del vaso -->
            <path d="M9.5 34 L11.5 53 C18 55, 30 55, 36.5 53 L38.5 34 C30 35.5, 18 35.5, 9.5 34 Z" fill="#fbfaf8" stroke="#0f0f0f" stroke-width="2.4" stroke-linejoin="round"/>
            <!-- Tapa escalonada del vaso -->
            <path d="M4 16 L44 16 L43 22 L5 22 Z" fill="#fbfaf8" stroke="#0f0f0f" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M9 10 L39 10 L41 16 L7 16 Z" fill="#fbfaf8" stroke="#0f0f0f" stroke-width="2.5" stroke-linejoin="round"/>
            <!-- Dedos sosteniendo el vaso -->
            <path d="M35 33 C43 32, 47 35, 45 39 C43 41, 37 41, 33 40" fill="#fbfaf8" stroke="#0f0f0f" stroke-width="2.3" stroke-linecap="round"/>
            <path d="M34 40 C43 40, 47 43, 45 46 C43 48, 36 48, 32 47" fill="#fbfaf8" stroke="#0f0f0f" stroke-width="2.3" stroke-linecap="round"/>
            <path d="M33 47 C41 47, 45 50, 43 53 C41 55, 35 55, 31 54" fill="#fbfaf8" stroke="#0f0f0f" stroke-width="2.3" stroke-linecap="round"/>
            <path d="M32 54 C38 55, 41 57, 39 60 C37 62, 33 61, 30 60" fill="#fbfaf8" stroke="#0f0f0f" stroke-width="2.3" stroke-linecap="round"/>
            <!-- Pulgar izquierdo -->
            <path d="M9 36 C3 34, 1 39, 5 43 C7 45, 9 45, 11 44" fill="#fbfaf8" stroke="#0f0f0f" stroke-width="2.3" stroke-linecap="round"/>
          </g>
        </g>

        <!-- GRUPO 5: Brazo derecho subiendo el vaso a la cara al escribir el PIN (00:04 - 00:06) -->
        <g id="arm-coffee-sip">
          <!-- Manga derecha doblada hacia arriba -->
          <path d="M226 112 C252 130, 266 164, 246 184 C232 196, 206 168, 198 140" fill="#fbfaf8" stroke="#0f0f0f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M214 102 C226 118, 232 138, 224 152" stroke="#0f0f0f" stroke-width="2.8" stroke-linecap="round"/>

          <!-- Vaso inclinado bebiendo junto al rostro -->
          <g transform="translate(178, 46) rotate(42)">
            <path d="M8 22 L13 68 C14 71, 34 71, 35 68 L40 22 Z" fill="#fbfaf8" stroke="#0f0f0f" stroke-width="2.6" stroke-linejoin="round"/>
            <path d="M9.5 34 L11.5 53 C18 55, 30 55, 36.5 53 L38.5 34 C30 35.5, 18 35.5, 9.5 34 Z" fill="#fbfaf8" stroke="#0f0f0f" stroke-width="2.4" stroke-linejoin="round"/>
            <path d="M4 16 L44 16 L43 22 L5 22 Z" fill="#fbfaf8" stroke="#0f0f0f" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M9 10 L39 10 L41 16 L7 16 Z" fill="#fbfaf8" stroke="#0f0f0f" stroke-width="2.5" stroke-linejoin="round"/>
            <!-- Dedos en el vaso al beber -->
            <path d="M35 33 C43 32, 47 35, 45 39 C43 41, 37 41, 33 40" fill="#fbfaf8" stroke="#0f0f0f" stroke-width="2.3" stroke-linecap="round"/>
            <path d="M34 40 C43 40, 47 43, 45 46 C43 48, 36 48, 32 47" fill="#fbfaf8" stroke="#0f0f0f" stroke-width="2.3" stroke-linecap="round"/>
            <path d="M33 47 C41 47, 45 50, 43 53 C41 55, 35 55, 31 54" fill="#fbfaf8" stroke="#0f0f0f" stroke-width="2.3" stroke-linecap="round"/>
          </g>
        </g>

      </svg>
    </div>

    <!-- Tarjeta de Registro idéntica al video -->
    <form class="register-card" onsubmit="event.preventDefault()">
      <input
        type="text"
        id="input-name"
        class="dark-pill-input"
        placeholder="Nombre"
        maxlength="35"
        autocomplete="off"
      />
      <input
        type="tel"
        id="input-phone"
        class="dark-pill-input"
        placeholder="Numero de telefono"
        maxlength="10"
        inputmode="numeric"
        autocomplete="off"
      />
      <input
        type="password"
        id="input-pin"
        class="dark-pill-input"
        placeholder="PIN"
        maxlength="4"
        inputmode="numeric"
        autocomplete="off"
      />
    </form>

    <!-- Botón de Trabajadores decorativo (idéntico al video) -->
    <button type="button" class="workers-title">Trabajadores</button>
    <button type="button" class="workers-footer">Trabajadores</button>

  </main>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const splash = document.getElementById('splash-screen');
      const stage = document.getElementById('login-stage');
      const charContainer = document.getElementById('character-container');
      const headGroup = document.getElementById('char-head-group');

      const nameInput = document.getElementById('input-name');
      const phoneInput = document.getElementById('input-phone');
      const pinInput = document.getElementById('input-pin');

      // 1. Mostrar bienvenida con tamales humeando durante 2.1 segundos y transicionar suave
      setTimeout(() => {
        splash.classList.add('hidden-splash');
        stage.classList.add('ready');

        // Después de saludar 2.2 segundos, baja la mano izquierda suavemente como en el segundo 00:02 del video
        setTimeout(() => {
          charContainer.classList.remove('is-waving');
          charContainer.classList.add('not-waving');
        }, 2200);
      }, 2100);

      // 2. Seguimiento de la cabeza mientras escribe Nombre o Teléfono
      function followTyping(e) {
        charContainer.classList.remove('is-waving', 'is-sipping');
        charContainer.classList.add('not-waving');

        const val = e.target.value || '';
        const max = Number(e.target.getAttribute('maxlength')) || 20;
        const ratio = Math.min(val.length / max, 1);

        // Inclinación sutil hacia abajo y paneo de izquierda a derecha mientras escribe
        const deg = -5 + (ratio * 10);
        const shiftX = -2 + (ratio * 4);
        headGroup.style.transform = `translate(${shiftX}px, 3px) rotate(${deg}deg)`;
      }

      function resetHead() {
        if (!charContainer.classList.contains('is-sipping')) {
          headGroup.style.transform = 'translate(0px, 0px) rotate(0deg)';
        }
      }

      [nameInput, phoneInput].forEach((inp) => {
        inp.addEventListener('focus', followTyping);
        inp.addEventListener('input', followTyping);
        inp.addEventListener('blur', resetHead);
      });

      // 3. Al tocar PIN: sube el vaso y toma café tapándose el rostro (00:04 - 00:06)
      pinInput.addEventListener('focus', () => {
        charContainer.classList.remove('is-waving');
        charContainer.classList.add('not-waving', 'is-sipping');
      });

      pinInput.addEventListener('blur', () => {
        charContainer.classList.remove('is-sipping');
        resetHead();
      });
    });
  </script>
</body>
</html>
