<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JERKOF - Overlay & Smart Pacing Studio</title>
    <style>
        :root {
            --red: #ff1a1a;
            --green: #00ff88;
            --yellow: #ffcc00;
            --purple: #aa00ff;
            --gold: #ffd700;
            --glass-bg: rgba(20, 0, 5, 0.72);
            --glass-border: rgba(255, 26, 26, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Escenario Principal (Captura toques para mostrar/ocultar controles) */
        #videoContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: pointer;
            background: #000;
        }

        #mainVideo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            display: none;
        }

        /* Lienzo Visible en Vivo (Renderiza exactamente lo que se ve y lo que se graba) */
        #stageCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        /* Efecto Ambilight Superior DOM (Sincronizado con el Canvas) */
        #ambilight {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 120px;
            pointer-events: none;
            z-index: 3;
            transition: background 0.4s ease, opacity 0.4s ease;
        }

        /* Metrónomo Superior DOM (Único elemento visible en pantalla durante el juego) */
        #metronomeBar {
            position: absolute;
            top: 15px;
            left: 10%;
            width: 80%;
            height: 4px;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 4px;
            z-index: 5;
            display: none;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        #metronomeDot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            position: absolute;
            top: -6px;
            left: 0%;
            margin-left: -8px;
            box-shadow: 0 0 15px currentColor;
            pointer-events: none;
        }

        /* Pantalla de Gloria / Clímax (Últimos 20 Segundos - Marco limpio sin textos) */
        #goldenOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 150px 50px rgba(255, 215, 0, 0.65);
            pointer-events: none;
            z-index: 4;
            display: none;
            animation: pulseGold 1.4s infinite alternate;
        }

        @keyframes pulseGold {
            0% { box-shadow: inset 0 0 90px 25px rgba(255, 215, 0, 0.4); }
            100% { box-shadow: inset 0 0 190px 65px rgba(255, 215, 0, 0.85); }
        }

        /* Interfaz de Configuración Inicial (Glassmorphism) */
        #setupUI {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            background: radial-gradient(circle, rgba(40,0,10,0.92) 0%, #000 100%);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 18px;
        }

        .glass-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 26px 20px;
            width: 100%;
            max-width: 430px;
            box-shadow: 0 15px 35px rgba(255, 26, 26, 0.15), inset 0 0 15px rgba(255, 26, 26, 0.1);
            display: flex;
            flex-direction: column;
            gap: 13px;
            max-height: 92vh;
            overflow-y: auto;
        }

        h1 {
            text-align: center;
            color: var(--red);
            font-size: 2.1rem;
            margin-bottom: 4px;
            text-shadow: 0 0 20px rgba(255,26,26,0.5);
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .subtitle-tag {
            text-align: center;
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: -8px;
            margin-bottom: 6px;
        }

        .setting-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            flex-wrap: wrap;
            gap: 10px;
        }

        .setting-group:last-of-type {
            border-bottom: none;
        }

        label {
            font-size: 0.9rem;
            color: #ddd;
            flex: 1;
            min-width: 120px;
        }

        .toggle-btn, .select-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--red);
            color: #fff;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.84rem;
            cursor: pointer;
            transition: all 0.25s ease;
            outline: none;
        }

        .select-btn {
            flex: 1.1;
            text-align: center;
        }

        .select-btn option {
            background: #140005;
            color: #fff;
        }

        .toggle-btn.active {
            background: var(--red);
            box-shadow: 0 0 15px rgba(255,26,26,0.6);
            color: #000;
            font-weight: bold;
        }

        .primary-start-btn {
            background: linear-gradient(45deg, #ff0044, #aa00ff);
            border: none;
            color: white;
            padding: 15px;
            border-radius: 16px;
            font-size: 1.02rem;
            font-weight: 800;
            margin-top: 6px;
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(255, 0, 68, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .primary-start-btn:active {
            transform: scale(0.97);
        }

        .record-start-btn {
            background: linear-gradient(45deg, #d90429, #ff1a1a);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            padding: 14px;
            border-radius: 16px;
            font-size: 0.96rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 26, 26, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .record-start-btn:active {
            transform: scale(0.97);
        }

        .secondary-upload-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.22);
            color: #eee;
            padding: 12px;
            border-radius: 14px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .secondary-upload-btn:hover {
            border-color: var(--red);
            background: rgba(255, 26, 26, 0.16);
        }

        .primary-start-btn svg, .record-start-btn svg, .secondary-upload-btn svg {
            width: 19px;
            height: 19px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        input[type="file"] {
            display: none;
        }

        /* Controles en Juego (Auto-ocultables, aparecen solo al tocar la pantalla) */
        #videoControls {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            pointer-events: none;
            flex-direction: column;
            gap: 12px;
            z-index: 15;
            background: linear-gradient(135deg, rgba(40, 0, 15, 0.68), rgba(18, 0, 5, 0.52));
            padding: 16px 20px;
            border-radius: 26px;
            backdrop-filter: blur(25px) saturate(150%);
            -webkit-backdrop-filter: blur(25px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0,0,0,0.7), inset 0 0 20px rgba(255, 26, 26, 0.18);
            width: 92%;
            max-width: 490px;
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        #videoControls.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* Píldoras rápidas de color y Gloria 20s */
        .quick-color-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            width: 100%;
        }

        .q-pill {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ddd;
            padding: 6px 4px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.2s ease;
        }

        .q-pill span.c-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .q-pill.active {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            transform: translateY(-1px);
        }

        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #eee;
            font-size: 0.82rem;
            font-family: monospace;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
        }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 15px var(--red), 0 0 5px #fff;
            transition: transform 0.2s ease;
        }

        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(1.3);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 2px;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .ctrl-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            cursor: pointer;
            padding: 11px 14px;
            border-radius: 15px;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.25);
        }

        .ctrl-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }

        .ctrl-btn:hover, .ctrl-btn:active {
            background: rgba(255, 26, 26, 0.3);
            border-color: rgba(255, 26, 26, 0.65);
            transform: scale(1.06);
        }

        .ctrl-btn.rec-action-btn {
            flex: 1;
            gap: 8px;
            font-size: 0.84rem;
            font-weight: 700;
            background: linear-gradient(45deg, rgba(255, 0, 68, 0.35), rgba(170, 0, 255, 0.35));
            border-color: rgba(255, 26, 26, 0.55);
        }

        .ctrl-btn.rec-action-btn.recording {
            background: rgba(255, 26, 26, 0.35);
            border-color: var(--red);
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 26, 26, 0.75);
            animation: recPulse 1.2s infinite alternate;
        }

        @keyframes recPulse {
            0% { box-shadow: 0 0 10px rgba(255, 26, 26, 0.45); }
            100% { box-shadow: 0 0 24px rgba(255, 26, 26, 0.95); }
        }

        /* Modal Elegante de Exportación y Descarga Garantizada */
        #exportModal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 40;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #exportModal.visible {
            display: flex;
        }

        .export-card {
            background: rgba(20, 4, 10, 0.92);
            border: 1px solid rgba(0, 255, 136, 0.45);
            border-radius: 24px;
            padding: 26px 22px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 14px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 30px rgba(0, 255, 136, 0.15);
        }

        .export-icon-circle {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: rgba(0, 255, 136, 0.14);
            border: 1px solid var(--green);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--green);
        }

        .export-icon-circle svg {
            width: 26px;
            height: 26px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .export-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: #fff;
        }

        .export-meta {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.72);
            line-height: 1.4;
        }

        .export-preview-video {
            width: 100%;
            max-height: 180px;
            border-radius: 14px;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.15);
            object-fit: contain;
        }

        .export-primary-dl {
            width: 100%;
            background: var(--green);
            color: #03140b;
            border: none;
            padding: 15px;
            border-radius: 15px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.4);
            text-decoration: none;
            transition: transform 0.18s ease;
        }

        .export-primary-dl:active {
            transform: scale(0.97);
        }

        .export-primary-dl svg, .export-alt-btn svg {
            width: 19px;
            height: 19px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .export-secondary-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .export-alt-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.22);
            color: #fff;
            padding: 11px 12px;
            border-radius: 13px;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
        }

        .export-alt-btn:hover {
            background: rgba(255, 255, 255, 0.16);
        }

        .export-status-note {
            font-size: 0.76rem;
            color: var(--green);
            min-height: 16px;
        }

        /* Pantalla de Pausa / Edging */
        #pauseOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.94);
            z-index: 20;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #pausePhrase {
            font-size: 2rem;
            color: var(--red);
            margin-bottom: 30px;
            font-weight: 300;
            text-shadow: 0 0 15px rgba(255,26,26,0.4);
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        #pauseTimer {
            font-size: 4rem;
            font-weight: bold;
            color: #fff;
            transition: font-size 0.4s ease, color 0.4s ease;
        }

        .huge-timer {
            font-size: 9.5rem !important;
            color: var(--red) !important;
            text-shadow: 0 0 40px rgba(255,26,26,0.8);
        }
    </style>
</head>
<body>

    <!-- Menú de Configuración Inicial -->
    <div id="setupUI">
        <div class="glass-panel">
            <h1>Jerkof</h1>
            <p class="subtitle-tag">Overlay & Smart Pacing Studio</p>
            
            <div class="setting-group">
                <label>Ajuste / Formato</label>
                <button type="button" class="toggle-btn active" id="btnFit" onclick="toggleFit()">Vertical (9:16)</button>
            </div>
            
            <div class="setting-group">
                <label>Modo de Semáforo</label>
                <select class="select-btn" id="modeSelect">
                    <option value="progressive">Niveles Progresivos</option>
                    <option value="random">Totalmente Aleatorio</option>
                </select>
            </div>
            
            <div class="setting-group">
                <label>Duración (Hasta 1 Hora)</label>
                <select class="select-btn" id="durationSelect">
                    <option value="1">1 Minuto (Prueba + Gloria 20s)</option>
                    <option value="5">5 Minutos</option>
                    <option value="15" selected>15 Minutos</option>
                    <option value="30">30 Minutos</option>
                    <option value="45">45 Minutos</option>
                    <option value="60">1 Hora (60 Minutos)</option>
                    <option value="auto">Adaptar al Video</option>
                </select>
            </div>

            <div class="setting-group">
                <label>Fondo Descargable</label>
                <select class="select-btn" id="bgModeSelect">
                    <option value="black">Negro Puro (Modo Pantalla Canva)</option>
                    <option value="chroma">Verde Chroma Key (#00FF00)</option>
                    <option value="strip">Solo Franja Superior (1920x240)</option>
                    <option value="video">Video + Semáforo (Si subes video)</option>
                </select>
            </div>

            <div class="setting-group">
                <label>Pausas de Edging</label>
                <button type="button" class="toggle-btn active" id="btnEdgingToggle" onclick="toggleEdgingPause()">Activadas</button>
            </div>
            
            <!-- Opción 1: Grabar y Descargar Overlay limpio desde el segundo 0 -->
            <button type="button" class="record-start-btn" onclick="startOverlayAndRecord()">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
                <span>Grabar y Descargar Sesión</span>
            </button>

            <!-- Opción 2: Iniciar solo el Overlay en vivo sin grabar aún -->
            <button type="button" class="primary-start-btn" onclick="startOverlayStandalone(false)">
                <svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg>
                <span>Iniciar Overlay (Sin Video)</span>
            </button>

            <!-- Opción 3: Seleccionar un video del dispositivo -->
            <input type="file" id="videoUpload" accept="video/*">
            <button type="button" class="secondary-upload-btn" onclick="document.getElementById('videoUpload').click()">
                <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><polygon points="10 9 15 12 10 15 10 9"/></svg>
                <span>Seleccionar Video y Empezar</span>
            </button>
        </div>
    </div>

    <!-- Contenedor Principal -->
    <div id="videoContainer">
        <video id="mainVideo" playsinline webkit-playsinline></video>
        <canvas id="stageCanvas"></canvas>
    </div>
    
    <!-- Elementos Visuales Superiores Limpios (Solo Metrónomo y Gloria) -->
    <div id="ambilight"></div>
    <div id="goldenOverlay"></div>

    <div id="metronomeBar">
        <div id="metronomeDot"></div>
    </div>

    <!-- Controles en Juego (Auto-ocultables, aparecen únicamente al tocar la pantalla) -->
    <div id="videoControls">
        <div class="quick-color-row">
            <button type="button" class="q-pill" id="qpill-red" onclick="forceColor('red')">
                <span class="c-dot" style="background:#ff1a1a"></span>Rojo
            </button>
            <button type="button" class="q-pill active" id="qpill-green" onclick="forceColor('green')">
                <span class="c-dot" style="background:#00ff88"></span>Verde
            </button>
            <button type="button" class="q-pill" id="qpill-yellow" onclick="forceColor('yellow')">
                <span class="c-dot" style="background:#ffcc00"></span>Amarillo
            </button>
            <button type="button" class="q-pill" id="qpill-purple" onclick="forceColor('purple')">
                <span class="c-dot" style="background:#aa00ff"></span>Morado
            </button>
            <button type="button" class="q-pill" id="qpill-gold" onclick="jumpToGoldenZone()" title="Ir a los últimos 20s (Momento de Gloria)">
                <span class="c-dot" style="background:#ffd700; box-shadow:0 0 6px #ffd700"></span>Gloria
            </button>
        </div>

        <div class="progress-container">
            <span id="currentTimeText">00:00</span>
            <input type="range" id="seekBar" min="0" max="900" value="0" step="0.1">
            <span id="durationTimeText">15:00</span>
        </div>

        <div class="control-row">
            <button type="button" class="ctrl-btn" onclick="returnToMenu()" title="Volver al Menú">
                <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
            <button type="button" class="ctrl-btn" onclick="skip(-10)" title="Retroceder 10s">
                <svg viewBox="0 0 24 24"><polygon points="11 19 2 12 11 5 11 19"/><polygon points="22 19 13 12 22 5 22 19"/></svg>
            </button>
            <button type="button" class="ctrl-btn" id="playPauseBtn" onclick="togglePlay()" title="Pausar / Reanudar">
                <svg viewBox="0 0 24 24"><line x1="9" y1="5" x2="9" y2="19"/><line x1="15" y1="5" x2="15" y2="19"/></svg>
            </button>
            <button type="button" class="ctrl-btn" onclick="skip(10)" title="Adelantar 10s">
                <svg viewBox="0 0 24 24"><polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/></svg>
            </button>
            <button type="button" class="ctrl-btn rec-action-btn" id="recBtn" onclick="toggleRecording()" title="Grabar y Descargar Video">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
                <span id="recBtnLabel">Grabar</span>

<script>
    // --- ELEMENTOS DEL DOM ---
    const videoContainer = document.getElementById('videoContainer');
    const video = document.getElementById('mainVideo');

    const stageCtx = stageCanvas.getContext('2d');

    const pauseOverlay = document.getElementById('pauseOverlay');
    const pausePhrase = document.getElementById('pausePhrase');
    const pauseTimer = document.getElementById('pauseTimer');
    const setupUI = document.getElementById('setupUI');
    const videoControls = document.getElementById('videoControls');
    const goldenOverlay = document.getElementById('goldenOverlay');
    const seekBar = document.getElementById('seekBar');
    const currentTimeText = document.getElementById('currentTimeText');
    const durationTimeText = document.getElementById('durationTimeText');
    const recBtn = document.getElementById('recBtn');

    // Elementos del Modal de Descarga
    const exportModal = document.getElementById('exportModal');
    const exportTitle = document.getElementById('exportTitle');
    const exportMeta = document.getElementById('exportMeta');
    const exportPreviewVideo = document.getElementById('exportPreviewVideo');
    const fallbackOpenLink = document.getElementById('fallbackOpenLink');
    const exportStatusNote = document.getElementById('exportStatusNote');

    // Iconos SVG minimalistas
    const iconPause = '<svg viewBox="0 0 24 24"><line x1="9" y1="5" x2="9" y2="19"/><line x1="15" y1="5" x2="15" y2="19"/></svg>';
    const iconPlay = '<svg viewBox="0 0 24 24"><polygon points="7 5 19 12 7 19 7 5"/></svg>';
    const iconRecStart = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg><span id="recBtnLabel">Grabar</span>';
    const iconRecStop = '<svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg><span id="recBtnLabel">Detener y Guardar</span>';

    // --- ESTADO DEL JUEGO Y TEMPORIZADOR HÍBRIDO (CON O SIN VIDEO) ---
    let gameActive = false;
    let hasUserVideo = false;
    let isSessionPaused = false;
    let currentColor = 'green';
    let dotPosition = 0;
    let dotDirection = 1;
    let virtualCurrentTime = 0;
    let lastFrameTime = performance.now();
    let animFrame = null;
    let analysisFrame = null;
    let pInt = null;
    let timeRemaining = 0;
    let isPausedByGame = false;
    let nextPauseTime = Infinity;
    let inGoldenZone = false;
    let colorStartTime = Date.now();
    let isSeeking = false;
    let controlsTimeout = null;
    let currentPauseSeconds = 30;
    let currentPauseText = "";

    // Estado de Grabación y Archivo Exportado
    let isRecording = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let recordingStartStamp = 0;
    let lastBlobUrl = null;
    let lastRecordedBlob = null;
    let lastFilename = 'jerkof-overlay.webm';

    // Configuraciones
    const config = {
        fit: 'cover',
        mode: 'progressive',
        targetDuration: 900, // 15 min por defecto, hasta 3600s (1 hora)
        bgMode: 'black',
        edgingEnabled: true
    };

    // Paleta de 4 colores con velocidades duplicadas + Estado Dorado (Momento de Gloria)
    const colors = {
        red: {
            label: 'Rojo',
            hex: '#ff1a1a',
            speed: 1.2,
            gTop: 'rgba(255, 26, 26, 0.62)',
            gMid: 'rgba(255, 26, 26, 0.26)',
            gSoft: 'rgba(255, 26, 26, 0.07)',
            glow: 'rgba(255, 26, 26, 0.7)'
        },
        green: {
            label: 'Verde',
            hex: '#00ff88',
            speed: 3.6,
            gTop: 'rgba(0, 255, 136, 0.56)',
            gMid: 'rgba(0, 255, 136, 0.22)',
            gSoft: 'rgba(0, 255, 136, 0.06)',
            glow: 'rgba(0, 255, 136, 0.65)'
        },
        yellow: {
            label: 'Amarillo',
            hex: '#ffcc00',
            speed: 6.0,
            gTop: 'rgba(255, 204, 0, 0.60)',
            gMid: 'rgba(255, 204, 0, 0.25)',
            gSoft: 'rgba(255, 204, 0, 0.07)',
            glow: 'rgba(255, 204, 0, 0.7)'
        },
        purple: {
            label: 'Morado',
            hex: '#aa00ff',
            speed: 9.0,
            gTop: 'rgba(170, 0, 255, 0.68)',
            gMid: 'rgba(170, 0, 255, 0.30)',
            gSoft: 'rgba(170, 0, 255, 0.09)',
            glow: 'rgba(170, 0, 255, 0.8)'
        },
        gold: {
            label: 'Gloria',
            hex: '#ffd700',
            speed: 10.5,
            gTop: 'rgba(255, 215, 0, 0.78)',
            gMid: 'rgba(255, 215, 0, 0.36)',
            gSoft: 'rgba(255, 215, 0, 0.12)',
            glow: 'rgba(255, 215, 0, 0.95)'
        }
    };

    const phrases = [
        "Estás a nada de soltar todo...",
        "Ya casi...",
        "Aguanta la presión...",
        "Controla la respiración...",
        "Siente cómo se acumula...",
        "No te rindas ahora..."
    ];

    // --- MOTOR DE AUDIO SINTETIZADO PRE-CONECTADO (CERO CONGELAMIENTO AL GRABAR) ---
    let audioCtx = null;
    let masterGain = null;
    let mediaDest = null;
    let videoAudioSource = null;

    function initAudio() {
        try {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return;
                audioCtx = new AudioContextClass();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 1.0;
                masterGain.connect(audioCtx.destination);

                // Canal de grabación pre-enrutado desde el inicio con señal silenciosa viva
                mediaDest = audioCtx.createMediaStreamDestination();
                masterGain.connect(mediaDest);

                const silentOsc = audioCtx.createOscillator();
                const silentGain = audioCtx.createGain();
                silentGain.gain.value = 0.00001;
                silentOsc.connect(silentGain);
                silentGain.connect(mediaDest);
                silentOsc.start();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        } catch (err) {}
    }

    function playBeatSound(colorKey) {
        if (!gameActive || isPausedByGame || isSessionPaused) return;
        initAudio();
        if (!audioCtx || !masterGain) return;

        const now = audioCtx.currentTime;
        const activeKey = inGoldenZone ? 'gold' : colorKey;

        if (activeKey === 'red') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(160, now);
            osc.frequency.exponentialRampToValueAtTime(95, now + 0.18);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.28, now + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

            osc.connect(gain);
            gain.connect(masterGain);
            osc.start(now);
            osc.stop(now + 0.24);
        } else if (activeKey === 'green') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(340, now);
            osc.frequency.exponentialRampToValueAtTime(310, now + 0.11);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.22, now + 0.008);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

            osc.connect(gain);
            gain.connect(masterGain);
            osc.start(now);
            osc.stop(now + 0.13);
        } else if (activeKey === 'yellow') {
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc1.type = 'triangle';
            osc1.frequency.setValueAtTime(520, now);
            osc1.frequency.exponentialRampToValueAtTime(480, now + 0.09);

            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(780, now);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.2, now + 0.006);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(masterGain);
            osc1.start(now);
            osc2.start(now);
            osc1.stop(now + 0.11);
            osc2.stop(now + 0.11);
        } else if (activeKey === 'purple') {
            const osc = audioCtx.createOscillator();
            const shimmer = audioCtx.createOscillator();
            const filter = audioCtx.createBiquadFilter();
            const gain = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(760, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.065);

            shimmer.type = 'sine';
            shimmer.frequency.setValueAtTime(1140, now);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(2400, now);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.18, now + 0.004);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.075);

            osc.connect(filter);
            shimmer.connect(filter);
            filter.connect(gain);
            gain.connect(masterGain);
            osc.start(now);
            shimmer.start(now);
            osc.stop(now + 0.085);
            shimmer.stop(now + 0.085);
        } else if (activeKey === 'gold') {
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc1.type = 'triangle';
            osc1.frequency.setValueAtTime(880, now);
            osc1.frequency.exponentialRampToValueAtTime(1174.66, now + 0.07);

            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(1318.5, now);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.22, now + 0.004);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(masterGain);
            osc1.start(now);
            osc2.start(now);
            osc1.stop(now + 0.085);
            osc2.stop(now + 0.085);
        }
    }

    function playColorShiftCue(colorKey) {
        if (!gameActive || isPausedByGame || isSessionPaused) return;
        initAudio();
        if (!audioCtx || !masterGain) return;

        const freqs = { red: 190, green: 390, yellow: 580, purple: 840, gold: 1046.5 };
        const targetFreq = freqs[colorKey] || 440;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(targetFreq * 0.85, now);
        osc.frequency.exponentialRampToValueAtTime(targetFreq, now + 0.14);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.14, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(now);
        osc.stop(now + 0.2);
    }

    // Formatear segundos a mm:ss
    function formatTime(sec) {
        if (isNaN(sec) || !isFinite(sec) || sec < 0) return "00:00";
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    // --- CONFIGURACIÓN DEL LIENZO DE ESCENARIO Y GRABACIÓN ---
    function updateStageCanvasSize() {
        if (isRecording) return;
        const bgMode = document.getElementById('bgModeSelect').value;
        config.bgMode = bgMode;

        if (bgMode === 'strip') {
            stageCanvas.width = 1920;
            stageCanvas.height = 240;
        } else if (config.fit === 'cover') {
            stageCanvas.width = 720;
            stageCanvas.height = 1280;
        } else {
            stageCanvas.width = 1280;
            stageCanvas.height = 720;
        }
    }

    window.addEventListener('resize', updateStageCanvasSize);

    // --- UI INICIAL ---
    function toggleFit() {
        const btn = document.getElementById('btnFit');
        config.fit = config.fit === 'cover' ? 'contain' : 'cover';
        btn.innerText = config.fit === 'cover' ? 'Vertical (9:16)' : 'Horizontal (16:9)';
        btn.classList.toggle('active');
        video.style.objectFit = config.fit;
        updateStageCanvasSize();
    }

    function toggleEdgingPause() {
        const btn = document.getElementById('btnEdgingToggle');
        config.edgingEnabled = !config.edgingEnabled;
        btn.innerText = config.edgingEnabled ? 'Activadas' : 'Desactivadas';
        btn.classList.toggle('active', config.edgingEnabled);
    }

    // --- INICIO OPCIÓN 1: GRABAR Y DESCARGAR DESDE EL SEGUNDO 0 ---
    function startOverlayAndRecord() {
        startOverlayStandalone(true);
    }

    // --- INICIO OPCIÓN 2: OVERLAY SIN VIDEO (HASTA 1 HORA) ---
    function startOverlayStandalone(autoRecord = false) {
        initAudio();
        hasUserVideo = false;
        video.pause();
        video.style.display = 'none';

        const durVal = document.getElementById('durationSelect').value;
        config.targetDuration = durVal === 'auto' ? 900 : parseFloat(durVal) * 60;
        config.mode = document.getElementById('modeSelect').value;
        config.bgMode = document.getElementById('bgModeSelect').value;

        updateStageCanvasSize();
        setupUI.style.display = 'none';
        metronomeBar.style.display = 'block';

        virtualCurrentTime = 0;
        seekBar.max = config.targetDuration;
        seekBar.value = 0;
        durationTimeText.innerText = formatTime(config.targetDuration);
        currentTimeText.innerText = "00:00";

        startGame();

        if (autoRecord) {
            // Arranca grabación con pantalla 100% limpia (solo metrónomo superior)
            videoControls.classList.remove('show');
            startRecording();
        } else {
            showControls();
        }
    }

    // --- INICIO OPCIÓN 3: CARGA DE VIDEO DEL USUARIO ---
    document.getElementById('videoUpload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        initAudio();
        hasUserVideo = true;
        const url = URL.createObjectURL(file);
        video.src = url;
        video.style.display = 'block';
        video.load();

        video.onloadedmetadata = () => {
            setupUI.style.display = 'none';
            metronomeBar.style.display = 'block';
            
            const dur = document.getElementById('durationSelect').value;
            config.targetDuration = dur === 'auto' ? (video.duration || 900) : parseFloat(dur) * 60;
            config.mode = document.getElementById('modeSelect').value;
            config.bgMode = document.getElementById('bgModeSelect').value;

            updateStageCanvasSize();
            virtualCurrentTime = 0;
            seekBar.max = config.targetDuration;
            seekBar.value = 0;
            durationTimeText.innerText = formatTime(config.targetDuration);
            currentTimeText.innerText = "00:00";
            
            startGame();
            showControls();
        };
    });

    // --- BARRA DE DESLIZAMIENTO (PERMITE RECORRER HASTA 60 MINUTOS Y PROBAR GLORIA) ---
    seekBar.addEventListener('input', () => {
        isSeeking = true;
        clearTimeout(controlsTimeout);
        const targetSec = parseFloat(seekBar.value);
        currentTimeText.innerText = formatTime(targetSec);
    });

    seekBar.addEventListener('change', () => {
        const targetSec = parseFloat(seekBar.value);
        virtualCurrentTime = targetSec;
        if (hasUserVideo && video.duration) {
            video.currentTime = targetSec % video.duration;
        }
        isSeeking = false;

        const rem = config.targetDuration - targetSec;
        if (rem > 20 && inGoldenZone) {
            exitGoldenZone();
        } else if (rem <= 20 && rem > 0 && !inGoldenZone) {
            triggerGoldenZone();
        }

        if (targetSec < nextPauseTime - 300) {
            scheduleNextPause();
        }
        showControls();
    });

    // --- MOTOR PRINCIPAL ---
    function startGame() {
        gameActive = true;
        isSessionPaused = false;
        isPausedByGame = false;
        inGoldenZone = false;
        currentColor = 'green';
        dotPosition = 50;
        dotDirection = 1;
        lastFrameTime = performance.now();

        document.getElementById('playPauseBtn').innerHTML = iconPause;
        goldenOverlay.style.display = 'none';
        updateQuickPillsUI();

        if (hasUserVideo) {
            video.play().catch(() => {});
        }
        colorStartTime = Date.now();
        
        scheduleNextPause();
        cancelAnimationFrame(animFrame);
        clearInterval(analysisFrame);
        animFrame = requestAnimationFrame(gameLoop);
        analysisFrame = setInterval(evaluatePacing, 1000); 
    }

    function getElapsedSessionTime(dt) {
        if (hasUserVideo && !video.paused && config.targetDuration <= (video.duration || 0)) {
            virtualCurrentTime = video.currentTime;
        } else if (!isSessionPaused && !isPausedByGame) {
            virtualCurrentTime += dt;
            if (hasUserVideo && video.duration && video.currentTime >= video.duration - 0.15) {
                video.currentTime = 0;
                video.play().catch(() => {});
            }
        }
        return virtualCurrentTime;
    }

    function gameLoop(now) {
        if (!gameActive) return;

        const dt = Math.min(0.1, Math.max(0.001, (now - lastFrameTime) / 1000));
        lastFrameTime = now;
        const frameScale = dt * 60;

        const currentRealTime = getElapsedSessionTime(dt);
        timeRemaining = Math.max(0, config.targetDuration - currentRealTime);

        if (!isSeeking) {
            seekBar.value = Math.min(config.targetDuration, currentRealTime);
            currentTimeText.innerText = formatTime(currentRealTime);
        }

        if (!isPausedByGame) {
            const activePalette = inGoldenZone ? colors.gold : colors[currentColor];

            if (!isSessionPaused) {
                const speed = activePalette.speed;
                dotPosition += speed * dotDirection * frameScale;
                if (dotPosition >= 100) {
                    dotPosition = 100;
                    dotDirection = -1;
                    playBeatSound(currentColor);
                } else if (dotPosition <= 0) {
                    dotPosition = 0;
                    dotDirection = 1;
                    playBeatSound(currentColor);
                }
            }
            
            // Actualizar DOM Superior (Solo metrónomo y luz superior limpios)
            metronomeDot.style.left = `${dotPosition}%`;
            metronomeDot.style.color = activePalette.hex;
            metronomeDot.style.background = activePalette.hex;
            metronomeDot.style.boxShadow = `0 0 16px ${activePalette.hex}, 0 0 6px #fff`;
            
            ambilight.style.background = `linear-gradient(180deg, ${activePalette.gTop} 0%, ${activePalette.gMid} 35%, ${activePalette.gSoft} 70%, rgba(0, 0, 0, 0) 100%)`;
            metronomeBar.style.boxShadow = `0 0 12px ${activePalette.glow}`;

            // Chequeos de Tiempo (Pausas Edging)
            if (config.edgingEnabled && currentRealTime >= nextPauseTime && timeRemaining > 30 && !inGoldenZone) {
                triggerPause();
            }

            // Clímax / Momento de Gloria (Últimos 20 segundos)
            if (timeRemaining <= 20 && timeRemaining > 0 && !inGoldenZone) {
                triggerGoldenZone();
            }
            
            // Finalización de la Sesión
            if (timeRemaining <= 0 && config.targetDuration > 0) {
                endGame();
                return; 
            }
        }

        // Renderizar fotograma en el Canvas Visible (que alimenta la grabación directamente)
        renderStageCanvasFrame();

        animFrame = requestAnimationFrame(gameLoop);
    }

    // --- DIBUJADO EN EL CANVAS VISIBLE / GRABABLE (INCLUYE MOMENTO DE GLORIA Y PAUSAS) ---
    function drawRoundedBar(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    function renderStageCanvasFrame() {
        const cw = stageCanvas.width;
        const ch = stageCanvas.height;
        const uiScale = cw / 720;

        // 1. Fondo según modo elegido
        if (config.bgMode === 'chroma') {
            stageCtx.fillStyle = '#00FF00';
            stageCtx.fillRect(0, 0, cw, ch);
        } else if (config.bgMode === 'video' && hasUserVideo && video.readyState >= 2) {
            stageCtx.fillStyle = '#000000';
            stageCtx.fillRect(0, 0, cw, ch);
            const vw = video.videoWidth || cw;
            const vh = video.videoHeight || ch;
            const videoRatio = vw / vh;
            const canvasRatio = cw / ch;
            let drawW, drawH;
            if (config.fit === 'cover') {
                if (videoRatio > canvasRatio) { drawH = ch; drawW = ch * videoRatio; }
                else { drawW = cw; drawH = cw / videoRatio; }
            } else {
                if (videoRatio > canvasRatio) { drawW = cw; drawH = cw / videoRatio; }
                else { drawH = ch; drawW = ch * videoRatio; }
            }
            stageCtx.drawImage(video, (cw - drawW) / 2, (ch - drawH) / 2, drawW, drawH);
        } else {
            if (hasUserVideo && !isRecording) {
                stageCtx.clearRect(0, 0, cw, ch);
            } else {
                stageCtx.fillStyle = '#000000';
                stageCtx.fillRect(0, 0, cw, ch);
            }
        }

        // 2. Si está en Pausa de Edging, renderizar la pantalla de pausa en la grabación
        if (isPausedByGame && config.bgMode !== 'strip') {
            stageCtx.fillStyle = '#000000';
            stageCtx.fillRect(0, 0, cw, ch);

            if (currentPauseSeconds > 5) {
                stageCtx.save();
                stageCtx.fillStyle = '#ff1a1a';
                stageCtx.shadowColor = 'rgba(255, 26, 26, 0.5)';
                stageCtx.shadowBlur = 15 * uiScale;
                stageCtx.font = `300 ${Math.round(28 * uiScale)}px -apple-system, BlinkMacSystemFont, sans-serif`;
                stageCtx.textAlign = 'center';
                stageCtx.textBaseline = 'middle';
                stageCtx.fillText(currentPauseText, cw / 2, ch / 2 - 45 * uiScale);
                stageCtx.restore();
            }

            stageCtx.save();
            const isHuge = currentPauseSeconds <= 5;
            stageCtx.fillStyle = isHuge ? '#ff1a1a' : '#ffffff';
            if (isHuge) {
                stageCtx.shadowColor = 'rgba(255, 26, 26, 0.85)';
                stageCtx.shadowBlur = 40 * uiScale;
            }
            const timerPx = isHuge ? 140 * uiScale : 64 * uiScale;
            stageCtx.font = `700 ${Math.round(timerPx)}px -apple-system, BlinkMacSystemFont, sans-serif`;
            stageCtx.textAlign = 'center';
            stageCtx.textBaseline = 'middle';
            stageCtx.fillText(String(currentPauseSeconds), cw / 2, isHuge ? ch / 2 : ch / 2 + 25 * uiScale);
            stageCtx.restore();
            return;
        }

        // 3. Luz Superior Ambilight + Barra del Metrónomo + Bolita
        const activePalette = inGoldenZone ? colors.gold : colors[currentColor];
        const ambHeight = config.bgMode === 'strip' ? ch * 0.92 : 135 * uiScale;
        const grad = stageCtx.createLinearGradient(0, 0, 0, ambHeight);
        grad.addColorStop(0, activePalette.gTop);
        grad.addColorStop(0.35, activePalette.gMid);
        grad.addColorStop(0.70, activePalette.gSoft);
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        stageCtx.fillStyle = grad;
        stageCtx.fillRect(0, 0, cw, ambHeight);

        const barX = cw * 0.10;
        const barW = cw * 0.80;
        const barY = config.bgMode === 'strip' ? 38 : 22 * uiScale;
        const barH = config.bgMode === 'strip' ? 7 : 5 * uiScale;

        stageCtx.save();
        stageCtx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        stageCtx.shadowColor = activePalette.glow;
        stageCtx.shadowBlur = 14 * uiScale;
        drawRoundedBar(stageCtx, barX, barY, barW, barH, barH / 2);
        stageCtx.fill();
        stageCtx.restore();

        const dotX = barX + (barW * (dotPosition / 100));
        const dotY = barY + barH / 2;
        const dotR = config.bgMode === 'strip' ? 14 : 9 * uiScale;

        stageCtx.save();
        stageCtx.fillStyle = activePalette.hex;
        stageCtx.shadowColor = activePalette.hex;
        stageCtx.shadowBlur = 22 * uiScale;
        stageCtx.beginPath();
        stageCtx.arc(dotX, dotY, dotR, 0, Math.PI * 2);
        stageCtx.fill();
        stageCtx.restore();

        stageCtx.save();
        stageCtx.fillStyle = '#ffffff';
        stageCtx.beginPath();
        stageCtx.arc(dotX, dotY, dotR * 0.45, 0, Math.PI * 2);
        stageCtx.fill();
        stageCtx.restore();

        // 4. Marco Dorado Pulsante Limpio durante el Momento de Gloria (Últimos 20s)
        if (inGoldenZone && config.bgMode !== 'strip') {
            const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 220);
            const borderW = (28 + pulse * 26) * uiScale;
            const alpha = 0.45 + pulse * 0.4;

            stageCtx.save();
            stageCtx.strokeStyle = `rgba(255, 215, 0, ${alpha})`;
            stageCtx.shadowColor = '#ffd700';
            stageCtx.shadowBlur = 45 * uiScale;
            stageCtx.lineWidth = borderW;
            stageCtx.strokeRect(0, 0, cw, ch);
            stageCtx.restore();
        }
    }

    // --- LÓGICA DE MODOS DE SEMÁFORO ---
    function evaluatePacing() {
        if (isPausedByGame || inGoldenZone || isSessionPaused) return;

        const timeInColor = (Date.now() - colorStartTime) / 1000;
        let nextColor = currentColor;
        const changeThreshold = 4 + Math.random() * 8; 

        if (timeInColor < changeThreshold) return;

        const rand = Math.random();

        if (config.mode === 'random') {
            if (rand < 0.25) nextColor = 'red';
            else if (rand < 0.50) nextColor = 'green';
            else if (rand < 0.75) nextColor = 'yellow';
            else nextColor = 'purple';
        } 
        else if (config.mode === 'progressive') {
            const totalPlayableTime = Math.max(1, config.targetDuration - 20);
            const timePlayed = config.targetDuration - timeRemaining;
            const progress = Math.max(0, Math.min(1, timePlayed / totalPlayableTime));

            if (progress < 0.25) {
                if (rand < 0.55) nextColor = 'green';
                else if (rand < 0.85) nextColor = 'red';
                else if (rand < 0.95) nextColor = 'yellow';
                else nextColor = 'purple';
            } 
            else if (progress < 0.50) {
                if (rand < 0.45) nextColor = 'green';
                else if (rand < 0.70) nextColor = 'yellow';
                else if (rand < 0.85) nextColor = 'red';
                else nextColor = 'purple';
            } 
            else if (progress < 0.75) {
                if (rand < 0.50) nextColor = 'yellow';
                else if (rand < 0.80) nextColor = 'purple';
                else if (rand < 0.95) nextColor = 'green';
                else nextColor = 'red';
            } 
            else {
                if (rand < 0.50) nextColor = 'purple';
                else if (rand < 0.80) nextColor = 'yellow';
                else if (rand < 0.90) nextColor = 'green';
                else nextColor = 'red';
            }
        }

        if (currentColor === 'purple' && timeInColor > 8) {
            nextColor = (Math.random() > 0.5) ? 'red' : 'green'; 
        }

        changeColor(nextColor);
    }

    function changeColor(nc) {
        if (currentColor === nc && !inGoldenZone) return;
        currentColor = nc;
        colorStartTime = Date.now();
        updateQuickPillsUI();
        playColorShiftCue(nc);
    }

    function forceColor(nc) {
        initAudio();
        if (inGoldenZone) {
            exitGoldenZone();
        }
        changeColor(nc);
        showControls();
    }

    function jumpToGoldenZone() {
        initAudio();
        virtualCurrentTime = Math.max(0, config.targetDuration - 20);
        if (hasUserVideo && video.duration) {
            video.currentTime = Math.max(0, video.duration - 20);
        }
        triggerGoldenZone();
        showControls();
    }

    function updateQuickPillsUI() {
        ['red', 'green', 'yellow', 'purple', 'gold'].forEach(k => {
            const el = document.getElementById(`qpill-${k}`);
            if (!el) return;
            const isAct = (inGoldenZone && k === 'gold') || (!inGoldenZone && k === currentColor);
            el.classList.toggle('active', isAct);
        });
    }

    // --- DESCANSOS Y MOMENTO DE GLORIA (ÚLTIMOS 20S) ---
    function scheduleNextPause() {
        if (!config.edgingEnabled || config.targetDuration < 60) {
            nextPauseTime = Infinity;
            return;
        }
        const interval = (Math.random() * 180) + 120; 
        nextPauseTime = virtualCurrentTime + interval;
    }

    function triggerPause() {
        isPausedByGame = true;
        if (hasUserVideo) video.pause();
        pauseOverlay.style.display = 'flex';
        videoControls.classList.remove('show');
        metronomeBar.style.display = 'none';
        ambilight.style.display = 'none';
        
        currentPauseText = phrases[Math.floor(Math.random() * phrases.length)];
        pausePhrase.innerText = currentPauseText;
        pausePhrase.style.opacity = 1;
        
        let pTime = 30;
        currentPauseSeconds = pTime;
        pauseTimer.innerText = pTime;
        pauseTimer.className = '';

        clearInterval(pInt);
        pInt = setInterval(() => {
            pTime--;
            currentPauseSeconds = pTime;
            pauseTimer.innerText = pTime;
            
            if (pTime <= 5) {
                pauseTimer.classList.add('huge-timer');
                pausePhrase.style.opacity = 0;
            }
            
            if (pTime <= 0) {
                clearInterval(pInt);
                isPausedByGame = false;
                pauseOverlay.style.display = 'none';
                metronomeBar.style.display = 'block';
                ambilight.style.display = 'block';
                if (hasUserVideo && !isSessionPaused) video.play().catch(() => {});
                scheduleNextPause();
                showControls();
            }
        }, 1000);
    }

    function triggerGoldenZone() {
        inGoldenZone = true;
        goldenOverlay.style.display = 'block';
        metronomeBar.style.display = 'block';
        updateQuickPillsUI();
        playColorShiftCue('gold');
    }

    function exitGoldenZone() {
        inGoldenZone = false;
        goldenOverlay.style.display = 'none';
        updateQuickPillsUI();
    }

    function endGame() {
        if (isRecording) {
            stopRecording();
        }
        gameActive = false;
        isSessionPaused = true;
        if (hasUserVideo) video.pause();
        goldenOverlay.style.display = 'none';
        ambilight.style.background = 'none';
        document.getElementById('playPauseBtn').innerHTML = iconPlay;
        showControls();
    }

    // --- SISTEMA DE GRABACIÓN Y DESCARGA GARANTIZADA ---
    function toggleRecording() {
        if (!gameActive) return;
        initAudio();
        if (isRecording) {
            stopRecording();
        } else {
            startRecording();
            showControls();
        }
    }

    function startRecording() {
        if (isRecording) return;
        initAudio();
        closeExportModal();

        if (isSessionPaused) {
            togglePlay();
        }

        renderStageCanvasFrame();

        const canvasStream = stageCanvas.captureStream
            ? stageCanvas.captureStream(30)
            : (stageCanvas.mozCaptureStream ? stageCanvas.mozCaptureStream(30) : null);

        if (!canvasStream) {
            exportTitle.innerText = 'Grabación no soportada';
            exportMeta.innerText = 'Tu navegador actual no soporta captura de lienzo. Prueba en Chrome, Edge o Safari.';
            exportModal.classList.add('visible');
            return;
        }

        const combinedTracks = [...canvasStream.getVideoTracks()];

        if (audioCtx && mediaDest) {
            try {
                if (hasUserVideo && config.bgMode === 'video' && !videoAudioSource) {
                    videoAudioSource = audioCtx.createMediaElementSource(video);
                    videoAudioSource.connect(audioCtx.destination);
                    videoAudioSource.connect(mediaDest);
                }
                const audioTracks = mediaDest.stream.getAudioTracks();
                if (audioTracks.length > 0) {
                    combinedTracks.push(audioTracks[0]);
                }
            } catch (e) {}
        }

        const mixedStream = new MediaStream(combinedTracks);
        const mimeOptions = [
            'video/mp4;codecs=avc1,mp4a.40.2',
            'video/mp4',
            'video/webm;codecs=vp9,opus',
            'video/webm;codecs=vp8,opus',
            'video/webm'
        ];
        let selectedMime = '';
        if (window.MediaRecorder && typeof MediaRecorder.isTypeSupported === 'function') {
            selectedMime = mimeOptions.find(m => MediaRecorder.isTypeSupported(m)) || '';
        }

        try {
            mediaRecorder = selectedMime
                ? new MediaRecorder(mixedStream, { mimeType: selectedMime, videoBitsPerSecond: 4000000 })
                : new MediaRecorder(mixedStream);
        } catch (err) {
            mediaRecorder = new MediaRecorder(canvasStream);
        }

        recordedChunks = [];
        mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) {
                recordedChunks.push(e.data);
            }
        };

        mediaRecorder.onstop = () => {
            const finalType = (mediaRecorder && mediaRecorder.mimeType) || selectedMime || 'video/webm';
            const ext = finalType.includes('mp4') ? 'mp4' : 'webm';
            const blob = new Blob(recordedChunks, { type: finalType });

            if (lastBlobUrl) {
                URL.revokeObjectURL(lastBlobUrl);
            }

            lastRecordedBlob = blob;
            lastFilename = `jerkof-session-${config.bgMode}.${ext}`;
            lastBlobUrl = URL.createObjectURL(blob);

            const recDurationSecs = Math.max(1, (performance.now() - recordingStartStamp) / 1000);
            const sizeMB = Math.max(0.01, blob.size / (1024 * 1024)).toFixed(2);

            exportTitle.innerText = 'Video Listo para Descargar';
            exportMeta.innerText = `Duración: ${formatTime(recDurationSecs)} · Peso: ${sizeMB} MB · Formato: .${ext.toUpperCase()}`;
            exportStatusNote.innerText = '';

            exportPreviewVideo.src = lastBlobUrl;
            fallbackOpenLink.href = lastBlobUrl;
            fallbackOpenLink.download = lastFilename;

            // Mostrar modal de descarga garantizada y pausar sesión en segundo plano
            videoControls.classList.remove('show');
            exportModal.classList.add('visible');

            // Intento automático inmediato de descarga estándar
            attemptAnchorDownload(lastBlobUrl, lastFilename);
        };

        mediaRecorder.start(1000);
        isRecording = true;
        recordingStartStamp = performance.now();
        recBtn.classList.add('recording');
        recBtn.innerHTML = iconRecStop;
    }

    function stopRecording() {
        if (!isRecording) return;
        isRecording = false;
        recBtn.classList.remove('recording');
        recBtn.innerHTML = iconRecStart;

        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            try {
                if (mediaRecorder.state === 'recording') {
                    mediaRecorder.requestData();
                }
            } catch (e) {}
            mediaRecorder.stop();
        }
    }

    function attemptAnchorDownload(url, filename) {
        try {
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                if (a.parentNode) document.body.removeChild(a);
            }, 1500);
        } catch (err) {}
    }

    // Mecanismo multi-capa al pulsar el botón verde "Descargar Video Ahora"
    async function triggerGuaranteedDownload() {
        if (!lastRecordedBlob) return;
        exportStatusNote.innerText = 'Procesando descarga...';

        // 1. File System Access API (Diálogo nativo "Guardar como..." en navegadores de escritorio)
        if (window.showSaveFilePicker) {
            try {
                const ext = lastFilename.endsWith('.mp4') ? '.mp4' : '.webm';
                const handle = await window.showSaveFilePicker({
                    suggestedName: lastFilename,
                    types: [{
                        description: 'Archivo de Video',
                        accept: { [lastRecordedBlob.type || 'video/webm']: [ext] }
                    }]
                });
                const writable = await handle.createWritable();
                await writable.write(lastRecordedBlob);
                await writable.close();
                exportStatusNote.innerText = 'Archivo guardado correctamente en tu dispositivo.';
                return;
            } catch (err) {
                if (err && err.name === 'AbortError') {
                    exportStatusNote.innerText = 'Guardado cancelado.';
                    return;
                }
            }
        }

        // 2. Web Share API con archivos (Móviles iOS/Android: guardar en galería / archivos)
        if (navigator.canShare && window.File) {
            try {
                const fileObj = new File([lastRecordedBlob], lastFilename, { type: lastRecordedBlob.type });
                if (navigator.canShare({ files: [fileObj] })) {
                    await navigator.share({
                        files: [fileObj],
                        title: 'JERKOF Video'
                    });
                    exportStatusNote.innerText = 'Archivo compartido / guardado.';
                    return;
                }
            } catch (err) {
                if (err && err.name === 'AbortError') {
                    exportStatusNote.innerText = '';
                    return;
                }
            }
        }

        // 3. Descarga directa con Blob URL
        attemptAnchorDownload(lastBlobUrl, lastFilename);

        // 4. Respaldo Data URL si el contenedor/iframe bloquea descargas blob:
        try {
            const reader = new FileReader();
            reader.onloadend = () => {
                if (typeof reader.result === 'string') {
                    fallbackOpenLink.href = reader.result;
                    attemptAnchorDownload(reader.result, lastFilename);
                }
            };
            reader.readAsDataURL(lastRecordedBlob);
        } catch (e) {}

        exportStatusNote.innerText = 'Descarga iniciada. Si tu navegador la bloquea, usa "Abrir / Compartir".';
    }

    function closeExportModal() {
        exportModal.classList.remove('visible');
        exportPreviewVideo.pause();
    }

    // --- CONTROLES DE VIDEO Y UI INTERACTIVA ---
    videoContainer.addEventListener('click', () => {
        if (gameActive && !isPausedByGame) {
            showControls();
        }
    });

    function showControls() {
        videoControls.classList.add('show');
        clearTimeout(controlsTimeout);
        
        controlsTimeout = setTimeout(() => {
            if (!isSessionPaused && !isSeeking) {
                videoControls.classList.remove('show');
            }
        }, 3000);
    }

    function togglePlay() {
        if (isPausedByGame) return;
        initAudio();
        const btn = document.getElementById('playPauseBtn');
        isSessionPaused = !isSessionPaused;

        if (!isSessionPaused) {
            if (!gameActive) {
                gameActive = true;
                lastFrameTime = performance.now();
                animFrame = requestAnimationFrame(gameLoop);
                analysisFrame = setInterval(evaluatePacing, 1000);
            }
            if (hasUserVideo) video.play().catch(() => {});
            btn.innerHTML = iconPause;
            showControls();
        } else {
            if (hasUserVideo) video.pause();
            btn.innerHTML = iconPlay;
            clearTimeout(controlsTimeout); 
            videoControls.classList.add('show');
        }
    }

    function skip(seconds) {
        if (isPausedByGame) return;
        initAudio();
        virtualCurrentTime = Math.max(0, Math.min(config.targetDuration, virtualCurrentTime + seconds));
        if (hasUserVideo && video.duration) {
            video.currentTime = virtualCurrentTime % video.duration;
        }
        const rem = config.targetDuration - virtualCurrentTime;
        if (rem > 20 && inGoldenZone) {
            exitGoldenZone();
        } else if (rem <= 20 && rem > 0 && !inGoldenZone) {
            triggerGoldenZone();
        }
        showControls();
    }

    // --- RESET TOTAL (BOTÓN VOLVER AL MENÚ) ---
    function returnToMenu() {
        if (isRecording) {
            stopRecording();
        }
        gameActive = false;
        isSessionPaused = false;
        
        cancelAnimationFrame(animFrame);
        clearInterval(analysisFrame);
        clearInterval(pInt);
        clearTimeout(controlsTimeout);
        
        video.pause();
        video.removeAttribute('src');
        video.style.display = 'none';
        document.getElementById('videoUpload').value = '';
        
        goldenOverlay.style.display = 'none';
        pauseOverlay.style.display = 'none';
        videoControls.classList.remove('show');
        metronomeBar.style.display = 'none';
        ambilight.style.display = 'block';
        ambilight.style.background = 'none';
        setupUI.style.display = 'flex';
        
        virtualCurrentTime = 0;
        timeRemaining = 0;
        isPausedByGame = false;
        inGoldenZone = false;
        currentColor = 'green';
        document.getElementById('playPauseBtn').innerHTML = iconPause;
    }

    // Exponer controladores globales
    window.toggleFit = toggleFit;
    window.toggleEdgingPause = toggleEdgingPause;
    window.startOverlayAndRecord = startOverlayAndRecord;
    window.startOverlayStandalone = startOverlayStandalone;
    window.forceColor = forceColor;
    window.jumpToGoldenZone = jumpToGoldenZone;
    window.returnToMenu = returnToMenu;
    window.skip = skip;
    window.togglePlay = togglePlay;
    window.toggleRecording = toggleRecording;
    window.triggerGuaranteedDownload = triggerGuaranteedDownload;
    window.closeExportModal = closeExportModal;
</script>
