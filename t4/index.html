<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jerkof - Smart Pacing</title>
    <style>
        :root {
            --red: #ff1a1a;
            --green: #00ff88;
            --yellow: #ffcc00;
            --purple: #aa00ff;
            --gold: #ffd700;
            --glass-bg: rgba(20, 0, 5, 0.72);
            --glass-border: rgba(255, 26, 26, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Escenario limpio: captura toques para mostrar controles sin estorbar */
        #stageContainer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 24px;
            z-index: 1;
            cursor: pointer;
        }

        /* Lienzo visible y exportable recortado exactamente a 1920x180 px (Proporción panorámica alargada) */
        #exportCanvas {
            width: 92%;
            max-width: 960px;
            aspect-ratio: 1920 / 180;
            display: block;
            border-radius: 14px;
            background: transparent;
            pointer-events: none;
            transition: box-shadow 0.3s ease;
        }

        /* Patrón de ajedrez muy tenue solo en vista previa si el fondo es transparente (no se graba en el canvas) */
        #exportCanvas.preview-checker {
            background-image:
                linear-gradient(45deg, rgba(255,255,255,0.035) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(255,255,255,0.035) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.035) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.035) 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0;
        }

        /* Interfaz de Configuración Inicial (Glassmorphism oscuro con acento rojo) */
        #setupUI {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            background: radial-gradient(circle, rgba(40, 0, 10, 0.92) 0%, #000 100%);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 20px;
        }

        .glass-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px 22px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(255, 26, 26, 0.16), inset 0 0 15px rgba(255, 26, 26, 0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 92vh;
            overflow-y: auto;
        }

        .title-wrap {
            text-align: center;
            margin-bottom: 6px;
        }

        h1 {
            color: var(--red);
            font-size: 2.2rem;
            text-shadow: 0 0 20px rgba(255, 26, 26, 0.55);
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 0.72rem;
            letter-spacing: 3.5px;
            color: rgba(255, 255, 255, 0.55);
            margin-top: 6px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .setting-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-wrap: wrap;
            gap: 10px;
        }

        .setting-group:last-of-type {
            border-bottom: none;
        }

        label {
            font-size: 0.92rem;
            color: #ddd;
            flex: 1;
            min-width: 130px;
        }

        .select-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--red);
            color: #fff;
            padding: 9px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s ease;
            outline: none;
            flex: 1.15;
            text-align: center;
        }

        .select-btn:focus {
            box-shadow: 0 0 12px rgba(255, 26, 26, 0.45);
        }

        .select-btn option {
            background: #120004;
            color: #fff;
        }

        .primary-btn {
            background: linear-gradient(45deg, #ff0044, #aa00ff);
            border: none;
            color: white;
            padding: 15px 18px;
            border-radius: 16px;
            font-size: 1.02rem;
            font-weight: 700;
            margin-top: 8px;
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(255, 0, 68, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .primary-btn:hover {
            box-shadow: 0 12px 26px rgba(255, 0, 68, 0.55);
        }

        .primary-btn:active {
            transform: scale(0.96);
        }

        .secondary-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: rgba(255, 255, 255, 0.82);
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .secondary-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.35);
            color: #fff;
        }

        .secondary-btn:active {
            transform: scale(0.97);
        }

        .btn-icon {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        /* Cápsula de Controles Minimalistas Auto-ocultables */
        #controlDock {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 15;
            background: linear-gradient(135deg, rgba(40, 0, 15, 0.65), rgba(20, 0, 5, 0.45));
            padding: 18px 22px;
            border-radius: 28px;
            backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), inset 0 0 18px rgba(255, 26, 26, 0.15);
            width: 90%;
            max-width: 440px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }

        #controlDock.show {
            opacity: 1;
            pointer-events: auto;
        }

        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #eee;
            font-size: 0.82rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        .progress-track {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.22);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--red);
            box-shadow: 0 0 10px var(--red);
            border-radius: 999px;
            transition: width 0.15s linear, background 0.3s ease;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            width: 100%;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
            padding: 12px 15px;
            border-radius: 16px;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
        }

        .ctrl-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }

        .ctrl-btn:hover, .ctrl-btn:active {
            background: rgba(255, 26, 26, 0.28);
            border-color: rgba(255, 26, 26, 0.65);
            transform: scale(1.06);
        }

        .ctrl-btn.gold-btn:hover, .ctrl-btn.gold-btn:active {
            background: rgba(255, 215, 0, 0.24);
            border-color: rgba(255, 215, 0, 0.75);
            color: var(--gold);
        }

        .ctrl-btn.rec-stop-btn {
            background: rgba(255, 26, 26, 0.24);
            border-color: var(--red);
            color: #fff;
            animation: recPulse 1.3s infinite alternate;
        }

        @keyframes recPulse {
            0% { box-shadow: 0 0 8px rgba(255, 26, 26, 0.45); }
            100% { box-shadow: 0 0 22px rgba(255, 26, 26, 0.95); }
        }

        /* Modal de Descarga Infalible */
        #exportModal {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.86);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 40;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #exportModal.show {
            display: flex;
        }

        .export-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 26px 22px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 26, 26, 0.2);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .export-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .export-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
        }

        .export-meta {
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.65);
            margin-top: 3px;
        }

        .close-modal-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .close-modal-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
        }

        .preview-box {
            width: 100%;
            background: #08080a;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 14px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #previewVideo {
            width: 100%;
            aspect-ratio: 1920 / 180;
            border-radius: 8px;
            background: #000;
            display: block;
        }

        .export-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .download-main-btn {
            background: linear-gradient(45deg, #ff0044, #aa00ff);
            border: none;
            color: #fff;
            padding: 15px 18px;
            border-radius: 16px;
            font-size: 0.98rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(255, 0, 68, 0.38);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            transition: transform 0.2s;
        }

        .download-main-btn:active {
            transform: scale(0.97);
        }

        .export-secondary-row {
            display: flex;
            gap: 10px;
        }

        .direct-link-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #eee;
            padding: 11px 14px;
            border-radius: 13px;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }

        .direct-link-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .status-toast {
            font-size: 0.8rem;
            color: var(--green);
            text-align: center;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Configuración Inicial -->
    <div id="setupUI">
        <div class="glass-panel">
            <div class="title-wrap">
                <h1>JERKOF</h1>
                <div class="subtitle">OVERLAY METRONOME</div>
            </div>

            <div class="setting-group">
                <label for="modeSelect">Modo de Semáforo</label>
                <select class="select-btn" id="modeSelect">
                    <option value="progressive">Niveles Progresivos</option>
                    <option value="random">Totalmente Aleatorio</option>
                </select>
            </div>

            <div class="setting-group">
                <label for="durationSelect">Duración de Sesión / Grabación</label>
                <select class="select-btn" id="durationSelect">
                    <option value="1">1 Minuto (Prueba + Gloria 20s)</option>
                    <option value="5">5 Minutos</option>
                    <option value="15">15 Minutos</option>
                    <option value="30">30 Minutos</option>
                    <option value="45">45 Minutos</option>
                    <option value="60">1 Hora (60 Minutos)</option>
                </select>
            </div>

            <div class="setting-group">
                <label for="bgSelect">Fondo de Exportación</label>
                <select class="select-btn" id="bgSelect">
                    <option value="transparent">Transparente (Alpha WebM)</option>
                    <option value="black">Negro Puro (Fusión Screen)</option>
                    <option value="green">Verde Chroma Key (#00FF00)</option>
                </select>
            </div>

            <button type="button" class="primary-btn" id="btnStartRecord">
                <svg class="btn-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="8"></circle>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <span>Iniciar y Grabar Metrónomo</span>
            </button>

            <button type="button" class="secondary-btn" id="btnStartPreview">
                <svg class="btn-icon" viewBox="0 0 24 24">
                    <polygon points="6 4 20 12 6 20 6 4"></polygon>
                </svg>
                <span>Solo Previsualizar (Sin Grabar)</span>
            </button>
        </div>
    </div>

    <!-- Escenario Limpio con el Metrónomo Panorámico Recortado (1920x180) -->
    <div id="stageContainer">
        <canvas id="exportCanvas" width="1920" height="180"></canvas>
    </div>

    <!-- Cápsula de Controles Minimalistas Auto-ocultables -->
    <div id="controlDock">
        <div class="progress-container">
            <span id="elapsedText">00:00</span>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span id="totalText">00:00</span>
        </div>

        <div class="control-row">
            <button type="button" class="ctrl-btn" id="btnBackMenu" title="Detener y Volver al Menú">
                <svg viewBox="0 0 24 24">
                    <rect x="6" y="6" width="12" height="12" rx="2"></rect>
                </svg>
            </button>

            <button type="button" class="ctrl-btn" id="btnPlayPause" title="Pausar / Reanudar">
                <svg viewBox="0 0 24 24">
                    <line x1="9" y1="5" x2="9" y2="19"></line>
                    <line x1="15" y1="5" x2="15" y2="19"></line>
                </svg>
            </button>

            <button type="button" class="ctrl-btn gold-btn" id="btnJumpGlory" title="Saltar al Momento de Gloria (Últimos 20s)">
                <svg viewBox="0 0 24 24">
                    <polygon points="12 2 14.8 8.8 22 9.4 16.5 14.1 18.2 21.2 12 17.4 5.8 21.2 7.5 14.1 2 9.4 9.2 8.8 12 2"></polygon>
                </svg>
            </button>

            <button type="button" class="ctrl-btn rec-stop-btn" id="btnStopDownload" title="Detener Grabación y Descargar">
                <svg viewBox="0 0 24 24">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
            </button>
        </div>
    </div>

    <!-- Modal de Descarga Infalible -->
    <div id="exportModal">
        <div class="export-card">
            <div class="export-header">
                <div>
                    <div class="export-title">Metrónomo Listo (1920x180)</div>
                    <div class="export-meta" id="exportMetaText">Preparando archivo...</div>
                </div>
                <button type="button" class="close-modal-btn" id="btnCloseModal" title="Cerrar">
                    <svg viewBox="0 0 24 24">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="preview-box">
                <video id="previewVideo" controls loop playsinline></video>
            </div>

            <div class="export-actions">
                <button type="button" class="download-main-btn" id="btnDownloadMain">
                    <svg class="btn-icon" viewBox="0 0 24 24">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    <span>Descargar Metrónomo (1920x180)</span>
                </button>

                <div class="export-secondary-row">
                    <button type="button" class="direct-link-btn" id="btnShareFile" style="display: none;">
                        <svg class="btn-icon" viewBox="0 0 24 24">
                            <circle cx="18" cy="5" r="3"></circle>
                            <circle cx="6" cy="12" r="3"></circle>
                            <circle cx="18" cy="19" r="3"></circle>
                            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                        </svg>
                        <span>Compartir / Guardar en Archivos</span>
                    </button>

                    <a class="direct-link-btn" id="directAnchorLink" href="#" download="jerkof-metronomo-1920x180.webm">
                        <svg class="btn-icon" viewBox="0 0 24 24">
                            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                        </svg>
                        <span>Enlace Directo</span>
                    </a>
                </div>
            </div>

            <div class="status-toast" id="statusToast"></div>
        </div>
    </div>

<script>
    // --- REFERENCIAS DOM ---
    const setupUI = document.getElementById('setupUI');
    const stageContainer = document.getElementById('stageContainer');
    const exportCanvas = document.getElementById('exportCanvas');
    const ctx = exportCanvas.getContext('2d', { alpha: true });

    const modeSelect = document.getElementById('modeSelect');
    const durationSelect = document.getElementById('durationSelect');
    const bgSelect = document.getElementById('bgSelect');

    const controlDock = document.getElementById('controlDock');
    const elapsedText = document.getElementById('elapsedText');
    const totalText = document.getElementById('totalText');
    const progressFill = document.getElementById('progressFill');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const btnStopDownload = document.getElementById('btnStopDownload');

    const exportModal = document.getElementById('exportModal');
    const exportMetaText = document.getElementById('exportMetaText');
    const previewVideo = document.getElementById('previewVideo');
    const btnDownloadMain = document.getElementById('btnDownloadMain');
    const btnShareFile = document.getElementById('btnShareFile');
    const directAnchorLink = document.getElementById('directAnchorLink');
    const statusToast = document.getElementById('statusToast');

    // --- ICONOS SVG MINIMALISTAS ---
    const svgPause = '<svg viewBox="0 0 24 24"><line x1="9" y1="5" x2="9" y2="19"></line><line x1="15" y1="5" x2="15" y2="19"></line></svg>';
    const svgPlay = '<svg viewBox="0 0 24 24"><polygon points="7 5 19 12 7 19 7 5"></polygon></svg>';
    const svgDownload = '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>';
    const svgRecord = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle></svg>';

    // --- CONFIGURACIÓN DE RITMOS Y VELOCIDADES EXACTAS ---
    const colors = {
        red: { hex: '#ff1a1a', speed: 1.2 },
        green: { hex: '#00ff88', speed: 3.6 },
        yellow: { hex: '#ffcc00', speed: 6.0 },
        purple: { hex: '#aa00ff', speed: 9.0 },
        gold: { hex: '#ffd700', speed: 10.5 }
    };

    // --- ESTADO DE SESIÓN Y METRÓNOMO ---
    let config = {
        mode: 'progressive',
        targetDuration: 60,
        bgMode: 'transparent'
    };

    let gameActive = false;
    let isUserPaused = false;
    let isEdgingPaused = false;
    let inGoldenZone = false;
    let currentColor = 'green';
    let dotPosition = 0;
    let dotDirection = 1;

    let elapsedSeconds = 0;
    let lastFrameTimestamp = 0;
    let colorStartTimestamp = 0;
    let nextPauseTarget = Infinity;
    let edgingRemaining = 0;

    let animFrameId = null;
    let pacingIntervalId = null;
    let edgingIntervalId = null;
    let controlsTimeoutId = null;

    // --- ESTADO DE AUDIO Y GRABACIÓN ---
    let audioCtx = null;
    let masterGain = null;
    let audioDestination = null;
    let keepAliveOsc = null;

    let isRecording = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let currentBlob = null;
    let currentBlobUrl = null;
    let currentFileName = 'jerkof-metronomo-1920x180.webm';
    let currentMimeType = 'video/webm';

    // --- MOTOR DE AUDIO SINTETIZADO (WEB AUDIO API) ---
    function initAudioEngine() {
        try {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return;

                audioCtx = new AudioContextClass();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 1.0;

                // Conectar salida audible y nodo de captura para MediaRecorder desde el inicio
                masterGain.connect(audioCtx.destination);
                audioDestination = audioCtx.createMediaStreamDestination();
                masterGain.connect(audioDestination);

                // Oscilador silencioso constante para evitar que MediaRecorder corte la pista en silencios
                keepAliveOsc = audioCtx.createOscillator();
                const silentGain = audioCtx.createGain();
                silentGain.gain.value = 0.0001;
                keepAliveOsc.frequency.value = 40;
                keepAliveOsc.connect(silentGain);
                silentGain.connect(audioDestination);
                keepAliveOsc.start();
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        } catch (err) {
            console.warn('AudioContext no disponible:', err);
        }
    }

    function playBeatSound(colorKey) {
        if (!gameActive || isUserPaused || isEdgingPaused) return;
        initAudioEngine();
        if (!audioCtx || !masterGain) return;

        try {
            const now = audioCtx.currentTime;

            if (colorKey === 'red') {
                // Sub-pulso grave seno 160Hz -> 95Hz
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(95, now + 0.18);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.3, now + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

                osc.connect(gain);
                gain.connect(masterGain);
                osc.start(now);
                osc.stop(now + 0.24);
            } else if (colorKey === 'green') {
                // Toque marimba triángulo 340Hz -> 310Hz
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(340, now);
                osc.frequency.exponentialRampToValueAtTime(310, now + 0.11);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.24, now + 0.008);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

                osc.connect(gain);
                gain.connect(masterGain);
                osc.start(now);
                osc.stop(now + 0.13);
            } else if (colorKey === 'yellow') {
                // Pulso armónico 520Hz + 780Hz
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc1.type = 'triangle';
                osc1.frequency.setValueAtTime(520, now);
                osc1.frequency.exponentialRampToValueAtTime(480, now + 0.09);

                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(780, now);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.22, now + 0.006);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(masterGain);
                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + 0.11);
                osc2.stop(now + 0.11);
            } else if (colorKey === 'purple') {
                // Ping cristalino rápido sawtooth/sine 760Hz -> 880Hz + 1140Hz con filtro paso bajo
                const osc = audioCtx.createOscillator();
                const shimmer = audioCtx.createOscillator();
                const filter = audioCtx.createBiquadFilter();
                const gain = audioCtx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(760, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.065);

                shimmer.type = 'sine';
                shimmer.frequency.setValueAtTime(1140, now);

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(2400, now);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.19, now + 0.004);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.075);

                osc.connect(filter);
                shimmer.connect(filter);
                filter.connect(gain);
                gain.connect(masterGain);
                osc.start(now);
                shimmer.start(now);
                osc.stop(now + 0.085);
                shimmer.stop(now + 0.085);
            } else if (colorKey === 'gold') {
                // Pulso armónico dorado brillante (Momento de Gloria)
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(880, now);
                osc1.frequency.exponentialRampToValueAtTime(1046.5, now + 0.06);

                osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(1318.5, now);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.22, now + 0.004);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.085);

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(masterGain);
                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + 0.09);
                osc2.stop(now + 0.09);
            }
        } catch (err) {}
    }

    function playColorShiftCue(colorKey) {
        if (!gameActive || isUserPaused || isEdgingPaused) return;
        initAudioEngine();
        if (!audioCtx || !masterGain) return;

        try {
            const freqs = { red: 190, green: 390, yellow: 580, purple: 840, gold: 1046 };
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime((freqs[colorKey] || 440) * 0.85, now);
            osc.frequency.exponentialRampToValueAtTime(freqs[colorKey] || 440, now + 0.12);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.13, now + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

            osc.connect(gain);
            gain.connect(masterGain);
            osc.start(now);
            osc.stop(now + 0.18);
        } catch (err) {}
    }

    // --- RENDERIZADO PANORÁMICO LIMPIO (1920 x 180 PX) ---
    function drawRoundedBar(context, x, y, w, h, r) {
        context.beginPath();
        context.moveTo(x + r, y);
        context.lineTo(x + w - r, y);
        context.quadraticCurveTo(x + w, y, x + w, y + r);
        context.lineTo(x + w, y + h - r);
        context.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        context.lineTo(x + r, y + h);
        context.quadraticCurveTo(x, y + h, x, y + h - r);
        context.lineTo(x, y + r);
        context.quadraticCurveTo(x, y, x + r, y);
        context.closePath();
    }

    function renderMetronomeFrame() {
        const cw = 1920;
        const ch = 180;

        // 1. Fondo exacto según configuración
        if (config.bgMode === 'transparent') {
            ctx.clearRect(0, 0, cw, ch);
        } else if (config.bgMode === 'green') {
            ctx.fillStyle = '#00FF00';
            ctx.fillRect(0, 0, cw, ch);
        } else {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, cw, ch);
        }

        const activeKey = inGoldenZone ? 'gold' : currentColor;
        const activeData = colors[activeKey];
        const hex = activeData.hex;

        // Dimensiones exactas de la barra y la bolita dentro de 1920x180
        const barX = 80;
        const barW = 1760; // de x = 80 hasta x = 1840
        const barH = 8;
        const barY = 90 - barH / 2; // centrada verticalmente en y = 90
        const dotR = 22;

        // Durante pausa de edging, la barra queda tenue en espera sin textos encima
        const isDimmed = isEdgingPaused;
        const pulseFactor = inGoldenZone ? (0.75 + 0.25 * Math.sin(performance.now() / 120)) : 1;

        // 2. Barra horizontal fina redondeada con brillo sutil del color activo
        ctx.save();
        ctx.fillStyle = isDimmed ? 'rgba(255, 255, 255, 0.08)' : 'rgba(255, 255, 255, 0.18)';
        ctx.shadowColor = isDimmed ? 'transparent' : hex;
        ctx.shadowBlur = inGoldenZone ? 22 * pulseFactor : 14;
        drawRoundedBar(ctx, barX, barY, barW, barH, barH / 2);
        ctx.fill();

        // Tinte sutil de color sobre la barra para mayor nitidez
        if (!isDimmed) {
            ctx.globalAlpha = inGoldenZone ? 0.55 : 0.25;
            ctx.fillStyle = hex;
            drawRoundedBar(ctx, barX, barY, barW, barH, barH / 2);
            ctx.fill();
        }
        ctx.restore();

        // 3. Bolita brillante desplazándose de extremo a extremo (con halo contenido dentro de 180px)
        const dotX = barX + (barW * (dotPosition / 100));
        const dotY = 90;

        ctx.save();
        ctx.globalAlpha = isDimmed ? 0.35 : 1.0;

        // Halo suave contenido (radio exterior máximo ~46px < 90px de margen vertical)
        const haloRadius = inGoldenZone ? 48 * pulseFactor : 40;
        const haloGrad = ctx.createRadialGradient(dotX, dotY, dotR * 0.4, dotX, dotY, haloRadius);
        haloGrad.addColorStop(0, hex);
        haloGrad.addColorStop(0.55, hex + '55');
        haloGrad.addColorStop(1, hex + '00');
        ctx.fillStyle = haloGrad;
        ctx.beginPath();
        ctx.arc(dotX, dotY, haloRadius, 0, Math.PI * 2);
        ctx.fill();

        // Esfera sólida vibrante
        ctx.shadowColor = hex;
        ctx.shadowBlur = inGoldenZone ? 26 : 18;
        ctx.fillStyle = hex;
        ctx.beginPath();
        ctx.arc(dotX, dotY, dotR, 0, Math.PI * 2);
        ctx.fill();

        // Núcleo especular sutil para definición cristalina sobre cualquier video
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.42)';
        ctx.beginPath();
        ctx.arc(dotX - dotR * 0.25, dotY - dotR * 0.25, dotR * 0.32, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    // --- MOTOR PRINCIPAL DE TIEMPO Y ANIMACIÓN ---
    function formatTime(sec) {
        if (!isFinite(sec) || sec < 0) sec = 0;
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function startSession(autoRecord) {
        initAudioEngine();

        config.mode = modeSelect.value;
        config.targetDuration = parseFloat(durationSelect.value) * 60;
        config.bgMode = bgSelect.value;

        exportCanvas.classList.toggle('preview-checker', config.bgMode === 'transparent');

        // Reiniciar variables de estado
        gameActive = true;
        isUserPaused = false;
        isEdgingPaused = false;
        inGoldenZone = false;
        currentColor = 'green';
        dotPosition = 0;
        dotDirection = 1;
        elapsedSeconds = 0;
        lastFrameTimestamp = performance.now();
        colorStartTimestamp = Date.now();

        btnPlayPause.innerHTML = svgPause;
        totalText.textContent = formatTime(config.targetDuration);
        elapsedText.textContent = '00:00';
        progressFill.style.width = '0%';
        progressFill.style.background = colors.green.hex;
        progressFill.style.boxShadow = `0 0 10px ${colors.green.hex}`;

        setupUI.style.display = 'none';
        scheduleNextPause();
        renderMetronomeFrame();

        if (autoRecord) {
            startCanvasRecording();
        } else {
            updateRecordButtonUI(false);
        }

        cancelAnimationFrame(animFrameId);
        clearInterval(pacingIntervalId);
        clearInterval(edgingIntervalId);

        animFrameId = requestAnimationFrame(gameLoop);
        pacingIntervalId = setInterval(evaluatePacing, 1000);
        showControlsTemporarily();
    }

    function gameLoop(now) {
        if (!gameActive) return;

        const dt = Math.min(0.1, (now - lastFrameTimestamp) / 1000);
        lastFrameTimestamp = now;

        if (!isUserPaused) {
            elapsedSeconds += dt;
            const timeRemaining = Math.max(0, config.targetDuration - elapsedSeconds);

            // Actualizar barra de progreso minimalista
            const pct = Math.min(100, (elapsedSeconds / config.targetDuration) * 100);
            elapsedText.textContent = formatTime(elapsedSeconds);
            progressFill.style.width = `${pct}%`;

            if (!isEdgingPaused) {
                const activeKey = inGoldenZone ? 'gold' : currentColor;
                // Escala sincronizada a 60fps base para respetar exactamente las velocidades (1.2, 3.6, 6.0, 9.0, 10.5)
                const step = colors[activeKey].speed * (dt * 60);
                dotPosition += step * dotDirection;

                if (dotPosition >= 100) {
                    dotPosition = 100;
                    dotDirection = -1;
                    playBeatSound(activeKey);
                } else if (dotPosition <= 0) {
                    dotPosition = 0;
                    dotDirection = 1;
                    playBeatSound(activeKey);
                }

                // Pausas programadas (cada 2 a 5 min si la duración >= 60s)
                if (elapsedSeconds >= nextPauseTarget && timeRemaining > 35 && !inGoldenZone) {
                    triggerEdgingPause();
                }

                // Momento de Gloria (Últimos 20 segundos)
                if (timeRemaining <= 20 && timeRemaining > 0 && !inGoldenZone) {
                    triggerGoldenZone();
                }
            }

            // Finalización automática al completar la duración
            if (timeRemaining <= 0) {
                renderMetronomeFrame();
                finishSession();
                return;
            }
        }

        renderMetronomeFrame();
        animFrameId = requestAnimationFrame(gameLoop);
    }

    // --- LÓGICA DEL SEMÁFORO (PROGRESIVO / ALEATORIO) ---
    function evaluatePacing() {
        if (!gameActive || isUserPaused || isEdgingPaused || inGoldenZone) return;

        const timeInColor = (Date.now() - colorStartTimestamp) / 1000;
        const changeThreshold = 4 + Math.random() * 8;
        if (timeInColor < changeThreshold) return;

        let nextColor = currentColor;
        const rand = Math.random();

        if (config.mode === 'random') {
            if (rand < 0.25) nextColor = 'red';
            else if (rand < 0.50) nextColor = 'green';
            else if (rand < 0.75) nextColor = 'yellow';
            else nextColor = 'purple';
        } else {
            const totalPlayable = Math.max(1, config.targetDuration - 20);
            const progress = Math.max(0, Math.min(1, elapsedSeconds / totalPlayable));

            if (progress < 0.25) {
                if (rand < 0.55) nextColor = 'green';
                else if (rand < 0.85) nextColor = 'red';
                else if (rand < 0.95) nextColor = 'yellow';
                else nextColor = 'purple';
            } else if (progress < 0.50) {
                if (rand < 0.45) nextColor = 'green';
                else if (rand < 0.70) nextColor = 'yellow';
                else if (rand < 0.85) nextColor = 'red';
                else nextColor = 'purple';
            } else if (progress < 0.75) {
                if (rand < 0.50) nextColor = 'yellow';
                else if (rand < 0.80) nextColor = 'purple';
                else if (rand < 0.95) nextColor = 'green';
                else nextColor = 'red';
            } else {
                if (rand < 0.50) nextColor = 'purple';
                else if (rand < 0.80) nextColor = 'yellow';
                else if (rand < 0.90) nextColor = 'green';
                else nextColor = 'red';
            }
        }

        // Sistema anti-bloqueo morado (> 8 segundos)
        if (currentColor === 'purple' && timeInColor > 8) {
            nextColor = Math.random() > 0.5 ? 'red' : 'green';
        }

        if (nextColor !== currentColor) {
            currentColor = nextColor;
            colorStartTimestamp = Date.now();
            progressFill.style.background = colors[nextColor].hex;
            progressFill.style.boxShadow = `0 0 10px ${colors[nextColor].hex}`;
            playColorShiftCue(nextColor);
        }
    }

    // --- PAUSAS DE EDGING Y MOMENTO DE GLORIA ---
    function scheduleNextPause() {
        if (config.targetDuration < 60) {
            nextPauseTarget = Infinity;
            return;
        }
        // Entre 2 y 5 minutos (120s a 300s)
        const interval = 120 + Math.random() * 180;
        nextPauseTarget = elapsedSeconds + interval;
    }

    function triggerEdgingPause() {
        isEdgingPaused = true;
        edgingRemaining = 30;
        clearInterval(edgingIntervalId);

        edgingIntervalId = setInterval(() => {
            if (!gameActive || isUserPaused) return;
            edgingRemaining--;
            if (edgingRemaining <= 0) {
                clearInterval(edgingIntervalId);
                isEdgingPaused = false;
                colorStartTimestamp = Date.now();
                scheduleNextPause();
            }
        }, 1000);
    }

    function triggerGoldenZone() {
        inGoldenZone = true;
        isEdgingPaused = false;
        clearInterval(edgingIntervalId);
        progressFill.style.background = colors.gold.hex;
        progressFill.style.boxShadow = `0 0 12px ${colors.gold.hex}`;
        playColorShiftCue('gold');
    }

    function jumpToGoldenZone() {
        if (!gameActive) return;
        initAudioEngine();
        elapsedSeconds = Math.max(0, config.targetDuration - 20);
        triggerGoldenZone();
        showControlsTemporarily();
    }

    // --- SISTEMA DE GRABACIÓN Y DESCARGA INFALIBLE ---
    function updateRecordButtonUI(recordingState) {
        if (recordingState) {
            btnStopDownload.classList.add('rec-stop-btn');
            btnStopDownload.title = 'Detener Grabación y Descargar';
            btnStopDownload.innerHTML = svgDownload;
        } else {
            btnStopDownload.classList.remove('rec-stop-btn');
            btnStopDownload.title = 'Iniciar Grabación del Metrónomo';
            btnStopDownload.innerHTML = svgRecord;
        }
    }

    function startCanvasRecording() {
        if (isRecording) return;
        initAudioEngine();

        try {
            const canvasStream = exportCanvas.captureStream(30);
            const tracks = [...canvasStream.getVideoTracks()];

            if (audioDestination && audioDestination.stream) {
                const audioTracks = audioDestination.stream.getAudioTracks();
                if (audioTracks.length > 0) {
                    tracks.push(audioTracks[0]);
                }
            }

            const combinedStream = new MediaStream(tracks);

            // Priorizar codecs compatibles con alpha cuando se selecciona fondo transparente
            const mimeCandidates = config.bgMode === 'transparent'
                ? [
                    'video/webm;codecs=vp9,opus',
                    'video/webm;codecs=vp8,opus',
                    'video/webm;codecs=vp9',
                    'video/webm;codecs=vp8',
                    'video/webm',
                    'video/mp4'
                ]
                : [
                    'video/webm;codecs=vp9,opus',
                    'video/webm;codecs=vp8,opus',
                    'video/mp4',
                    'video/webm'
                ];

            let chosenMime = '';
            if (window.MediaRecorder && typeof MediaRecorder.isTypeSupported === 'function') {
                chosenMime = mimeCandidates.find(type => MediaRecorder.isTypeSupported(type)) || '';
            }

            recordedChunks = [];
            mediaRecorder = chosenMime
                ? new MediaRecorder(combinedStream, { mimeType: chosenMime, videoBitsPerSecond: 4000000 })
                : new MediaRecorder(combinedStream);

            currentMimeType = mediaRecorder.mimeType || chosenMime || 'video/webm';

            mediaRecorder.ondataavailable = (event) => {
                if (event.data && event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = () => {
                finalizeRecordedBlob();
            };

            mediaRecorder.start(1000);
            isRecording = true;
            updateRecordButtonUI(true);
        } catch (err) {
            console.error('Error al iniciar MediaRecorder:', err);
            isRecording = false;
            updateRecordButtonUI(false);
        }
    }

    function stopCanvasRecording() {
        if (!isRecording || !mediaRecorder) return;
        isRecording = false;
        updateRecordButtonUI(false);

        try {
            if (mediaRecorder.state === 'recording') {
                mediaRecorder.requestData();
            }
            if (mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        } catch (err) {
            console.error('Error al detener MediaRecorder:', err);
            finalizeRecordedBlob();
        }
    }

    function finalizeRecordedBlob() {
        if (!recordedChunks.length) return;

        const isMp4 = currentMimeType.toLowerCase().includes('mp4');
        const ext = isMp4 ? 'mp4' : 'webm';
        currentFileName = `jerkof-metronomo-1920x180.${ext}`;

        currentBlob = new Blob(recordedChunks, { type: currentMimeType });
        currentBlobUrl = URL.createObjectURL(currentBlob);

        const sizeMB = (currentBlob.size / (1024 * 1024)).toFixed(2);
        const bgLabels = {
            transparent: 'Transparente (Alpha)',
            black: 'Negro Puro',
            green: 'Chroma Verde'
        };

        exportMetaText.textContent = `1920 x 180 px · ${sizeMB} MB · ${bgLabels[config.bgMode] || 'WebM'}`;
        previewVideo.src = currentBlobUrl;
        directAnchorLink.href = currentBlobUrl;
        directAnchorLink.download = currentFileName;
        statusToast.textContent = '';

        // Mostrar botón de compartir/guardar en archivos si el navegador móvil lo soporta
        try {
            const testFile = new File([currentBlob], currentFileName, { type: currentMimeType });
            if (navigator.canShare && navigator.canShare({ files: [testFile] })) {
                btnShareFile.style.display = 'flex';
            } else {
                btnShareFile.style.display = 'none';
            }
        } catch (e) {
            btnShareFile.style.display = 'none';
        }

        // Pausar bucle de fondo mientras el usuario descarga y abrir modal
        isUserPaused = true;
        btnPlayPause.innerHTML = svgPlay;
        controlDock.classList.remove('show');
        exportModal.classList.add('show');
    }

    // Ejecución escalonada de descarga infalible (File System Access API -> Anchor Blob -> Respaldo)
    async function triggerRobustDownload() {
        if (!currentBlob || !currentBlobUrl) return;
        statusToast.textContent = '';

        // Intento 1: window.showSaveFilePicker (si está disponible y permitido en el contexto)
        if (typeof window.showSaveFilePicker === 'function') {
            try {
                const isMp4 = currentFileName.endsWith('.mp4');
                const handle = await window.showSaveFilePicker({
                    suggestedName: currentFileName,
                    types: [{
                        description: 'Video Overlay Metrónomo',
                        accept: { [currentMimeType]: [isMp4 ? '.mp4' : '.webm'] }
                    }]
                });
                const writable = await handle.createWritable();
                await writable.write(currentBlob);
                await writable.close();
                statusToast.textContent = 'Archivo guardado correctamente.';
                return;
            } catch (err) {
                // Si el usuario canceló explícitamente el diálogo, no forzar segunda descarga
                if (err && err.name === 'AbortError') return;
                // Si está bloqueado por iframe/permisos, continuar al Intento 2
            }
        }

        // Intento 2: Descarga directa con <a download> y Blob URL persistente
        try {
            const tempLink = document.createElement('a');
            tempLink.style.display = 'none';
            tempLink.href = currentBlobUrl;
            tempLink.download = currentFileName;
            document.body.appendChild(tempLink);
            tempLink.click();
            setTimeout(() => {
                if (tempLink.parentNode) {
                    tempLink.parentNode.removeChild(tempLink);
                }
            }, 2000);
            statusToast.textContent = 'Descarga iniciada. Si no baja automáticamente, usa Enlace Directo.';
        } catch (err) {
            statusToast.textContent = 'Usa "Enlace Directo" o "Compartir" para guardar el video.';
        }
    }

    // Intento 3: Respaldo móvil / iframe mediante navigator.share con archivo
    async function triggerShareFile() {
        if (!currentBlob) return;
        try {
            const file = new File([currentBlob], currentFileName, { type: currentMimeType });
            if (navigator.share) {
                await navigator.share({
                    files: [file],
                    title: 'JERKOF Metrónomo 1920x180'
                });
                statusToast.textContent = 'Archivo compartido / guardado.';
            }
        } catch (err) {
            if (err && err.name !== 'AbortError') {
                statusToast.textContent = 'Mantén presionado "Enlace Directo" para descargar.';
            }
        }
    }

    // --- CONTROLES DE SESIÓN Y AUTO-OCULTADO ---
    function showControlsTemporarily() {
        if (!gameActive || exportModal.classList.contains('show')) return;
        controlDock.classList.add('show');
        clearTimeout(controlsTimeoutId);

        controlsTimeoutId = setTimeout(() => {
            if (!isUserPaused) {
                controlDock.classList.remove('show');
            }
        }, 3000);
    }

    function togglePlayPause() {
        if (!gameActive) return;
        initAudioEngine();
        isUserPaused = !isUserPaused;

        if (isUserPaused) {
            btnPlayPause.innerHTML = svgPlay;
            clearTimeout(controlsTimeoutId);
            controlDock.classList.add('show');
        } else {
            lastFrameTimestamp = performance.now();
            btnPlayPause.innerHTML = svgPause;
            showControlsTemporarily();
        }
    }

    function finishSession() {
        gameActive = false;
        cancelAnimationFrame(animFrameId);
        clearInterval(pacingIntervalId);
        clearInterval(edgingIntervalId);

        if (isRecording) {
            stopCanvasRecording();
        } else {
            isUserPaused = true;
            btnPlayPause.innerHTML = svgPlay;
            showControlsTemporarily();
        }
    }

    function returnToMenu() {
        const wasRecording = isRecording;
        gameActive = false;
        isUserPaused = false;
        isEdgingPaused = false;
        inGoldenZone = false;

        cancelAnimationFrame(animFrameId);
        clearInterval(pacingIntervalId);
        clearInterval(edgingIntervalId);
        clearTimeout(controlsTimeoutId);

        controlDock.classList.remove('show');
        setupUI.style.display = 'flex';

        if (wasRecording) {
            stopCanvasRecording();
        }
    }

    // --- EVENTOS DE INTERFAZ ---
    document.getElementById('btnStartRecord').addEventListener('click', () => startSession(true));
    document.getElementById('btnStartPreview').addEventListener('click', () => startSession(false));

    stageContainer.addEventListener('click', () => {
        if (gameActive) {
            showControlsTemporarily();
        }
    });

    document.getElementById('btnBackMenu').addEventListener('click', (e) => {
        e.stopPropagation();
        returnToMenu();
    });

    btnPlayPause.addEventListener('click', (e) => {
        e.stopPropagation();
        togglePlayPause();
    });

    document.getElementById('btnJumpGlory').addEventListener('click', (e) => {
        e.stopPropagation();
        jumpToGoldenZone();
    });

    btnStopDownload.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isRecording) {
            stopCanvasRecording();
        } else {
            startCanvasRecording();
            showControlsTemporarily();
        }
    });

    btnDownloadMain.addEventListener('click', triggerRobustDownload);
    btnShareFile.addEventListener('click', triggerShareFile);

    document.getElementById('btnCloseModal').addEventListener('click', () => {
        previewVideo.pause();
        exportModal.classList.remove('show');
        if (gameActive) {
            showControlsTemporarily();
        }
    });

    // Dibujo inicial limpio en el lienzo
    renderMetronomeFrame();
</script>
</body>
</html>
