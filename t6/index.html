<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JERKOF - Overlay Metronome (1920x180)</title>
    <style>
        /* =========================================================
           VARIABLES DE DISEÑO Y PALETA OSCURA GLASSMORPHISM
        ========================================================= */
        :root {
            --red: #ff1a1a;
            --green: #00ff88;
            --yellow: #ffcc00;
            --purple: #aa00ff;
            --gold: #ffd700;
            --glass-bg: rgba(18, 2, 7, 0.76);
            --glass-border: rgba(255, 26, 26, 0.3);
            --glass-soft: rgba(255, 255, 255, 0.06);
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.62);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: var(--text-main);
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Permitir selección únicamente dentro de inputs numéricos */
        input[type="number"] {
            user-select: text;
            -webkit-user-select: text;
        }

        /* =========================================================
           ESCENARIO LIMPIO Y LIENZO PANORÁMICO 1920x180
        ========================================================= */
        #stageContainer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: clamp(16px, 4vh, 42px) 16px 120px;
            z-index: 1;
            cursor: pointer;
        }

        /* Contenedor del canvas: aplica cuadrícula solo en vista previa transparente */
        #canvasWrapper {
            width: 100%;
            max-width: 1120px;
            aspect-ratio: 1920 / 180;
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            background: transparent;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.07);
            transition: box-shadow 0.3s ease;
        }

        #canvasWrapper.checker-bg {
            background-color: #111116;
            background-image:
                linear-gradient(45deg, rgba(255, 255, 255, 0.06) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(255, 255, 255, 0.06) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(255, 255, 255, 0.06) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(255, 255, 255, 0.06) 75%);
            background-size: 18px 18px;
            background-position: 0 0, 0 9px, 9px -9px, -9px 0;
        }

        #metronomeCanvas {
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
        }

        /* =========================================================
           MENÚ DE CONFIGURACIÓN INICIAL (#setupUI)
        ========================================================= */
        #setupUI {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 18px;
            z-index: 30;
            background: radial-gradient(circle at 50% 25%, rgba(45, 0, 14, 0.92) 0%, #000000 100%);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .glass-panel {
            width: 100%;
            max-width: 430px;
            max-height: 92vh;
            overflow-y: auto;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 26px;
            padding: 28px 22px 24px;
            box-shadow: 0 22px 50px rgba(0, 0, 0, 0.78), 0 0 36px rgba(255, 26, 26, 0.14), inset 0 0 18px rgba(255, 26, 26, 0.08);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 4px;
        }

        .brand-header h1 {
            color: var(--red);
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            text-shadow: 0 0 22px rgba(255, 26, 26, 0.5);
            line-height: 1.05;
        }

        .brand-subtitle {
            margin-top: 7px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 3px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .setting-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 11px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.09);
            flex-wrap: wrap;
        }

        .setting-group.column-group {
            flex-direction: column;
            align-items: stretch;
            gap: 12px;
            border-bottom: none;
            padding-bottom: 4px;
        }

        .setting-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .setting-label {
            font-size: 0.9rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.88);
        }

        .setting-hint {
            font-size: 0.74rem;
            color: var(--text-muted);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        .select-btn {
            flex: 1.15;
            min-width: 175px;
            background: var(--glass-soft);
            border: 1px solid rgba(255, 26, 26, 0.55);
            color: #ffffff;
            padding: 10px 12px;
            border-radius: 13px;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        }

        .select-btn:focus {
            border-color: var(--red);
            box-shadow: 0 0 14px rgba(255, 26, 26, 0.35);
            background: rgba(255, 255, 255, 0.09);
        }

        .select-btn option {
            background: #120005;
            color: #ffffff;
        }

        /* Selector de Duración Exacta (mm:ss) */
        .time-picker-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 26, 26, 0.35);
            border-radius: 16px;
            padding: 12px 14px;
            box-shadow: inset 0 0 14px rgba(0, 0, 0, 0.45);
        }

        .time-field {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex: 1;
        }

        .time-input {
            width: 100%;
            max-width: 112px;
            background: rgba(0, 0, 0, 0.52);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 12px;
            color: #ffffff;
            font-size: 1.75rem;
            font-weight: 700;
            text-align: center;
            padding: 8px 6px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            -moz-appearance: textfield;
        }

        .time-input::-webkit-outer-spin-button,
        .time-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .time-input:focus {
            border-color: var(--red);
            box-shadow: 0 0 14px rgba(255, 26, 26, 0.42);
        }

        .time-unit {
            font-size: 0.68rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .time-colon {
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--red);
            margin-top: -16px;
            text-shadow: 0 0 12px rgba(255, 26, 26, 0.55);
        }

        /* Píldoras rápidas de duración */
        .preset-row {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            justify-content: space-between;
        }

        .preset-pill {
            flex: 1;
            min-width: 58px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: rgba(255, 255, 255, 0.8);
            border-radius: 999px;
            padding: 7px 8px;
            font-size: 0.76rem;
            font-weight: 600;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .preset-pill:hover,
        .preset-pill.active {
            background: rgba(255, 26, 26, 0.22);
            border-color: rgba(255, 26, 26, 0.72);
            color: #ffffff;
            box-shadow: 0 0 12px rgba(255, 26, 26, 0.25);
        }

        /* Botones principales del menú */
        .menu-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 4px;
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(45deg, #ff0044, #aa00ff);
            border: none;
            color: #ffffff;
            padding: 15px 18px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.4px;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(255, 0, 68, 0.38);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.18s ease, box-shadow 0.2s ease;
        }

        .btn-primary:hover {
            box-shadow: 0 12px 28px rgba(255, 0, 68, 0.52);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: rgba(255, 255, 255, 0.9);
            padding: 13px 16px;
            border-radius: 15px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 26, 26, 0.16);
            border-color: rgba(255, 26, 26, 0.55);
            color: #ffffff;
        }

        .btn-secondary:active {
            transform: scale(0.97);
        }

        .svg-icon {
            width: 19px;
            height: 19px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
            pointer-events: none;
        }

        /* =========================================================
           CONTROLES FLOTANTES AUTO-OCULTABLES (#controlsDock)
        ========================================================= */
        #controlsDock {
            position: absolute;
            bottom: 26px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 470px;
            z-index: 15;
            background: linear-gradient(135deg, rgba(38, 2, 14, 0.72), rgba(14, 2, 6, 0.6));
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 28px;
            padding: 18px 22px;
            backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%);
            box-shadow: 0 18px 38px rgba(0, 0, 0, 0.75), inset 0 0 18px rgba(255, 26, 26, 0.14);
            display: flex;
            flex-direction: column;
            gap: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }

        #controlsDock.show {
            opacity: 1;
            pointer-events: auto;
        }

        .seek-row {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .time-readout {
            font-size: 0.8rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            color: rgba(255, 255, 255, 0.88);
            white-space: nowrap;
            min-width: 92px;
            text-align: right;
        }

        input[type="range"]#seekBar {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            background: transparent;
            cursor: pointer;
        }

        input[type="range"]#seekBar::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.22);
            border-radius: 999px;
        }

        input[type="range"]#seekBar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            margin-top: -6px;
            box-shadow: 0 0 14px var(--red), 0 0 4px #ffffff;
            transition: transform 0.18s ease;
        }

        input[type="range"]#seekBar::-webkit-slider-thumb:active {
            transform: scale(1.25);
        }

        input[type="range"]#seekBar::-moz-range-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.22);
            border-radius: 999px;
        }

        input[type="range"]#seekBar::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border: none;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 14px var(--red), 0 0 4px #ffffff;
        }

        .dock-buttons {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
        }

        .ctrl-btn {
            flex: 1;
            min-height: 46px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.17);
            color: #ffffff;
            border-radius: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.22s ease;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
        }

        .ctrl-btn:hover,
        .ctrl-btn:active {
            background: rgba(255, 26, 26, 0.26);
            border-color: rgba(255, 26, 26, 0.65);
            transform: scale(1.04);
        }

        .ctrl-btn.gold-btn:hover,
        .ctrl-btn.gold-btn.active {
            background: rgba(255, 215, 0, 0.22);
            border-color: rgba(255, 215, 0, 0.75);
            color: var(--gold);
        }

        .ctrl-btn.recording {
            background: rgba(255, 26, 26, 0.26);
            border-color: var(--red);
            color: var(--red);
            animation: recPulse 1.25s infinite alternate;
        }

        .ctrl-btn.muted {
            color: rgba(255, 255, 255, 0.45);
            border-color: rgba(255, 255, 255, 0.12);
        }

        @keyframes recPulse {
            0% { box-shadow: 0 0 8px rgba(255, 26, 26, 0.4); }
            100% { box-shadow: 0 0 22px rgba(255, 26, 26, 0.95); }
        }

        /* =========================================================
           MODAL DE EXPORTACIÓN Y DESCARGA (#exportModal)
        ========================================================= */
        #exportModal {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.86);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 40;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 18px;
        }

        #exportModal.show {
            display: flex;
        }

        .export-card {
            width: 100%;
            max-width: 500px;
            max-height: 92vh;
            overflow-y: auto;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 26px;
            padding: 24px 22px;
            box-shadow: 0 24px 55px rgba(0, 0, 0, 0.85), 0 0 32px rgba(255, 26, 26, 0.18);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .export-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .export-title {
            font-size: 1.12rem;
            font-weight: 700;
            color: #ffffff;
        }

        .export-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .meta-pill {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 999px;
            padding: 5px 11px;
            font-size: 0.76rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            color: rgba(255, 255, 255, 0.88);
        }

        .preview-shell {
            width: 100%;
            background: #08080b;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 16px;
            padding: 10px;
        }

        #previewVideo {
            width: 100%;
            aspect-ratio: 1920 / 180;
            display: block;
            border-radius: 8px;
            background: #000000;
        }

        .export-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .export-status {
            min-height: 18px;
            font-size: 0.8rem;
            text-align: center;
            color: var(--green);
        }

        .export-status.warn {
            color: var(--yellow);
        }
    </style>
</head>
<body>

    <!-- =========================================================
         1. MENÚ DE CONFIGURACIÓN INICIAL
    ========================================================= -->
    <div id="setupUI">
        <div class="glass-panel">
            <div class="brand-header">
                <h1>JERKOF</h1>
                <div class="brand-subtitle">OVERLAY METRONOME · 1920×180</div>
            </div>

            <!-- Modo de Semáforo -->
            <div class="setting-group">
                <label class="setting-label" for="modeSelect">Modo de Semáforo</label>
                <select class="select-btn" id="modeSelect">
                    <option value="progressive">Niveles Progresivos</option>
                    <option value="random">Totalmente Aleatorio</option>
                </select>
            </div>

            <!-- Fondo de Exportación -->
            <div class="setting-group">
                <label class="setting-label" for="bgSelect">Fondo de Exportación</label>
                <select class="select-btn" id="bgSelect">
                    <option value="black">Negro Puro (CapCut / Screen)</option>
                    <option value="green">Verde Chroma Key (Canva)</option>
                    <option value="transparent">Transparente (Alpha WebM)</option>
                </select>
            </div>

            <!-- Duración Exacta Personalizada (mm:ss) -->
            <div class="setting-group column-group">
                <div class="setting-label-row">
                    <span class="setting-label">Duración Exacta (mm:ss)</span>
                    <span class="setting-hint" id="durationSummary">05:48 · máx 60:00</span>
                </div>

                <div class="time-picker-box">
                    <div class="time-field">
                        <input
                            type="number"
                            id="inputMinutes"
                            class="time-input"
                            min="0"
                            max="60"
                            value="05"
                            inputmode="numeric"
                            aria-label="Minutos"
                        >
                        <span class="time-unit">Min</span>
                    </div>

                    <span class="time-colon">:</span>

                    <div class="time-field">
                        <input
                            type="number"
                            id="inputSeconds"
                            class="time-input"
                            min="0"
                            max="59"
                            value="48"
                            inputmode="numeric"
                            aria-label="Segundos"
                        >
                        <span class="time-unit">Seg</span>
                    </div>
                </div>

                <!-- Accesos rápidos -->
                <div class="preset-row" id="presetRow">
                    <button type="button" class="preset-pill" data-min="1" data-sec="0">1:00</button>
                    <button type="button" class="preset-pill" data-min="5" data-sec="0">5:00</button>
                    <button type="button" class="preset-pill" data-min="15" data-sec="0">15:00</button>
                    <button type="button" class="preset-pill" data-min="30" data-sec="0">30:00</button>
                    <button type="button" class="preset-pill" data-min="60" data-sec="0">60:00</button>
                </div>
            </div>

            <!-- Botones de Inicio -->
            <div class="menu-actions">
                <button type="button" class="btn-primary" id="btnStartSession">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <polygon points="6 4 20 12 6 20 6 4"></polygon>
                    </svg>
                    <span>Iniciar Sesión</span>
                </button>

                <button type="button" class="btn-secondary" id="btnStartAndRecord">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="8"></circle>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <span>Iniciar y Grabar Ahora</span>
                </button>
            </div>
        </div>
    </div>

    <!-- =========================================================
         2. ESCENARIO LIMPIO CON LIENZO 1920x180
    ========================================================= -->
    <div id="stageContainer">
        <div id="canvasWrapper">
            <canvas id="metronomeCanvas" width="1920" height="180"></canvas>
        </div>
    </div>

    <!-- =========================================================
         3. CONTROLES MINIMALISTAS AUTO-OCULTABLES
    ========================================================= -->
    <div id="controlsDock">
        <div class="seek-row">
            <input type="range" id="seekBar" min="0" max="348" value="0" step="0.1" aria-label="Progreso de sesión">
            <span class="time-readout" id="timeReadout">00:00 / 05:48</span>
        </div>

        <div class="dock-buttons">
            <button type="button" class="ctrl-btn" id="btnReturnMenu" title="Detener y Volver al Menú">
                <svg class="svg-icon" viewBox="0 0 24 24">
                    <rect x="6" y="6" width="12" height="12" rx="2"></rect>
                </svg>
            </button>

            <button type="button" class="ctrl-btn" id="btnPlayPause" title="Pausar / Reanudar">
                <svg class="svg-icon" viewBox="0 0 24 24">
                    <line x1="9" y1="5" x2="9" y2="19"></line>
                    <line x1="15" y1="5" x2="15" y2="19"></line>
                </svg>
            </button>

            <button type="button" class="ctrl-btn" id="btnRecordToggle" title="Grabar / Detener y Guardar">
                <svg class="svg-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="8"></circle>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </button>

            <button type="button" class="ctrl-btn gold-btn" id="btnJumpGlory" title="Saltar al Momento de Gloria (Últimos 20s)">
                <svg class="svg-icon" viewBox="0 0 24 24">
                    <polygon points="12 2 14.9 8.6 22 9.3 16.6 14 18.2 21 12 17.3 5.8 21 7.4 14 2 9.3 9.1 8.6 12 2"></polygon>
                </svg>
            </button>

            <button type="button" class="ctrl-btn" id="btnMuteToggle" title="Silenciar / Activar Sonido">
                <svg class="svg-icon" viewBox="0 0 24 24">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- =========================================================
         4. MODAL DE EXPORTACIÓN Y DESCARGA
    ========================================================= -->
    <div id="exportModal">
        <div class="export-card">
            <div class="export-header">
                <div class="export-title">Exportación Lista</div>
            </div>

    /* =====================================================================

    const COLORS = {

    /* =====================================================================

    let audioCtx = null;

    /* =====================================================================
       UTILIDADES DE FORMATO Y VALIDACIÓN DE DURACIÓN EXACTA (mm:ss)
    ===================================================================== */
    function pad2(n) {
        return String(Math.max(0, Math.floor(n))).padStart(2, '0');
    }

    function formatMMSS(totalSec) {
        const clamped = Math.max(0, Math.floor(totalSec));
        const m = Math.floor(clamped / 60);
        const s = clamped % 60;
        return `${pad2(m)}:${pad2(s)}`;
    }

    function formatFilenameDuration(totalSec) {
        const clamped = Math.max(0, Math.round(totalSec));
        const m = Math.floor(clamped / 60);
        const s = clamped % 60;
        return `${pad2(m)}m${pad2(s)}s`;
    }

    /**
     * Lee, normaliza y acota los inputs de minutos y segundos (00:10 a 60:00).
     * @param {boolean} formatInputs Si es true, formatea con 2 dígitos los inputs.
     * @returns {number} Duración total en segundos.
     */
    function syncCustomDuration(formatInputs = false) {
        let mins = parseInt(inputMinutes.value, 10);
        let secs = parseInt(inputSeconds.value, 10);

        if (isNaN(mins) || mins < 0) mins = 0;
        if (mins > 60) mins = 60;

        if (isNaN(secs) || secs < 0) secs = 0;
        if (secs > 59) secs = 59;

        // Si minutos es 60, forzar segundos a 00
        if (mins === 60) {
            secs = 0;
        }

        let total = mins * 60 + secs;

        // Garantizar mínimo de 10 segundos al confirmar/iniciar
        if (formatInputs && total < MIN_DURATION_SEC) {
            mins = 0;
            secs = MIN_DURATION_SEC;
            total = MIN_DURATION_SEC;
        }

        if (formatInputs) {
            inputMinutes.value = pad2(mins);
            inputSeconds.value = pad2(secs);
        } else if (mins === 60 && inputSeconds.value !== '00' && inputSeconds.value !== '0') {
            inputSeconds.value = '00';
        }

        const effectiveTotal = Math.max(MIN_DURATION_SEC, Math.min(MAX_DURATION_SEC, total));
        config.totalDuration = effectiveTotal;
        durationSummary.textContent = `${formatMMSS(effectiveTotal)} · máx 60:00`;

        // Resaltar píldora activa si coincide exactamente
        presetButtons.forEach((btn) => {
            const pTotal = parseInt(btn.dataset.min, 10) * 60 + parseInt(btn.dataset.sec, 10);
            btn.classList.toggle('active', pTotal === effectiveTotal);
        });

        return effectiveTotal;
    }

    inputMinutes.addEventListener('input', () => syncCustomDuration(false));
    inputSeconds.addEventListener('input', () => syncCustomDuration(false));
    inputMinutes.addEventListener('blur', () => syncCustomDuration(true));
    inputSeconds.addEventListener('blur', () => syncCustomDuration(true));
    inputMinutes.addEventListener('change', () => syncCustomDuration(true));
    inputSeconds.addEventListener('change', () => syncCustomDuration(true));

    presetButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
            inputMinutes.value = pad2(parseInt(btn.dataset.min, 10));
            inputSeconds.value = pad2(parseInt(btn.dataset.sec, 10));
            syncCustomDuration(true);
        });
    });

    /* =====================================================================
       MOTOR DE AUDIO SINTETIZADO (WEB AUDIO API)
    ===================================================================== */
    function initAudioEngine() {
        try {
            if (!audioCtx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;

                audioCtx = new AudioCtx();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = isMuted ? 0 : 1.0;

                // Conectado permanentemente a altavoces y al nodo de grabación MediaRecorder
                mediaDest = audioCtx.createMediaStreamDestination();
                masterGain.connect(audioCtx.destination);
                masterGain.connect(mediaDest);

                // Oscilador silencioso keep-alive (0.00001) directo a mediaDest para evitar stalls
                keepAliveOsc = audioCtx.createOscillator();
                const keepAliveGain = audioCtx.createGain();
                keepAliveOsc.frequency.value = 45;
                keepAliveGain.gain.value = 0.00001;
                keepAliveOsc.connect(keepAliveGain);
                keepAliveGain.connect(mediaDest);
                keepAliveOsc.start();
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        } catch (err) {
            console.warn('Web Audio API no disponible:', err);
        }
    }

    function playBeatSound(colorKey) {
        if (!sessionActive || isPaused || isMuted) return;
        initAudioEngine();
        if (!audioCtx || !masterGain) return;

        try {
            const now = audioCtx.currentTime;

            if (colorKey === 'red') {
                // Rojo: sub-pulso seno grave y calmado (160Hz -> 95Hz)
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(95, now + 0.18);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.3, now + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

                osc.connect(gain);
                gain.connect(masterGain);
                osc.start(now);
                osc.stop(now + 0.24);
            } else if (colorKey === 'green') {
                // Verde: toque limpio marimba triángulo (340Hz -> 310Hz)
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(340, now);
                osc.frequency.exponentialRampToValueAtTime(310, now + 0.11);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.24, now + 0.008);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

                osc.connect(gain);
                gain.connect(masterGain);
                osc.start(now);
                osc.stop(now + 0.13);
            } else if (colorKey === 'yellow') {
                // Amarillo: pulso armónico enérgico (520Hz triángulo + 780Hz seno)
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc1.type = 'triangle';
                osc1.frequency.setValueAtTime(520, now);
                osc1.frequency.exponentialRampToValueAtTime(480, now + 0.09);

                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(780, now);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.22, now + 0.006);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.10);

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(masterGain);
                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + 0.11);
                osc2.stop(now + 0.11);
            } else if (colorKey === 'purple') {
                // Morado: ping cristalino brillante (760Hz->880Hz sawtooth + 1140Hz seno por filtro 2400Hz)
                const osc = audioCtx.createOscillator();
                const shimmer = audioCtx.createOscillator();
                const filter = audioCtx.createBiquadFilter();
                const gain = audioCtx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(760, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.065);

                shimmer.type = 'sine';
                shimmer.frequency.setValueAtTime(1140, now);

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(2400, now);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.19, now + 0.004);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.075);

                osc.connect(filter);
                shimmer.connect(filter);
                filter.connect(gain);
                gain.connect(masterGain);
                osc.start(now);
                shimmer.start(now);
                osc.stop(now + 0.085);
                shimmer.stop(now + 0.085);
            } else if (colorKey === 'gold') {
                // Dorado: destello armónico brillante (880Hz + 1320Hz seno)
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(880, now);

                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(1320, now);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.22, now + 0.005);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(masterGain);
                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + 0.1);
                osc2.stop(now + 0.1);
            }
        } catch (err) {}
    }

    function playColorShiftCue(colorKey) {
        if (!sessionActive || isPaused || isMuted) return;
        initAudioEngine();
        if (!audioCtx || !masterGain) return;

        try {
            const freqs = { red: 190, green: 390, yellow: 580, purple: 840, gold: 1046 };
            const targetFreq = freqs[colorKey] || 440;
            const now = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(targetFreq * 0.84, now);
            osc.frequency.exponentialRampToValueAtTime(targetFreq, now + 0.12);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.12, now + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

            osc.connect(gain);
            gain.connect(masterGain);
            osc.start(now);
            osc.stop(now + 0.18);
        } catch (err) {}
    }

    /* =====================================================================
       RENDERIZADO DEL LIENZO LIMPIO 1920x180
    ===================================================================== */
    function drawRoundedRect(context, x, y, w, h, r) {
        context.beginPath();
        context.moveTo(x + r, y);
        context.lineTo(x + w - r, y);
        context.quadraticCurveTo(x + w, y, x + w, y + r);
        context.lineTo(x + w, y + h - r);
        context.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        context.lineTo(x + r, y + h);
        context.quadraticCurveTo(x, y + h, x, y + h - r);
        context.lineTo(x, y + r);
        context.quadraticCurveTo(x, y, x + r, y);
        context.closePath();
    }

    function renderCanvas(nowMs) {
        const cw = 1920;
        const ch = 180;

        // 1. Fondo limpio según configuración
        if (config.bgMode === 'transparent') {
            ctx.clearRect(0, 0, cw, ch);
        } else if (config.bgMode === 'green') {
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(0, 0, cw, ch);
        } else {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, cw, ch);
        }

        const activeKey = inGoldenZone ? 'gold' : currentColor;
        const hex = COLORS[activeKey].hex;
        const pulse = inGoldenZone ? (0.78 + 0.22 * Math.sin(nowMs / 110)) : 1;

        // 2. Barra horizontal redondeada centrada (86% del ancho, 12px de alto)
        const trackW = cw * 0.86;
        const trackX = (cw - trackW) / 2;
        const trackH = 12;
        const trackY = (ch - trackH) / 2;

        ctx.save();
        // Base translúcida blanca con resplandor del color activo
        ctx.shadowColor = hex;
        ctx.shadowBlur = inGoldenZone ? 28 * pulse : 18;
        ctx.fillStyle = config.bgMode === 'green'
            ? 'rgba(255, 255, 255, 0.36)'
            : 'rgba(255, 255, 255, 0.22)';
        drawRoundedRect(ctx, trackX, trackY, trackW, trackH, trackH / 2);
        ctx.fill();

        // Tinte sutil de color integrado en la barra
        ctx.shadowBlur = 0;
        ctx.globalAlpha = inGoldenZone ? 0.62 * pulse : 0.34;
        ctx.fillStyle = hex;
        drawRoundedRect(ctx, trackX, trackY, trackW, trackH, trackH / 2);
        ctx.fill();
        ctx.restore();

        // 3. Bolita luminosa (radio 26px) deslizándose de extremo a extremo
        const dotR = 26;
        const dotX = trackX + (trackW * (dotPosition / 100));
        const dotY = ch / 2;

        ctx.save();
        // Halo suave contenido dentro de la altura de 180px
        const haloR = inGoldenZone ? 58 * pulse : 48;
        const haloGrad = ctx.createRadialGradient(dotX, dotY, dotR * 0.45, dotX, dotY, haloR);
        haloGrad.addColorStop(0, hex);
        haloGrad.addColorStop(0.5, `${hex}66`);
        haloGrad.addColorStop(1, `${hex}00`);
        ctx.fillStyle = haloGrad;
        ctx.beginPath();
        ctx.arc(dotX, dotY, haloR, 0, Math.PI * 2);
        ctx.fill();

        // Cuerpo circular vibrante
        ctx.shadowColor = hex;
        ctx.shadowBlur = inGoldenZone ? 34 * pulse : 22;
        ctx.fillStyle = hex;
        ctx.beginPath();
        ctx.arc(dotX, dotY, dotR, 0, Math.PI * 2);
        ctx.fill();

        // Reflejo blanco interior sutil para máximo contraste en todos los fondos (incluido Chroma)
        ctx.shadowBlur = 0;
        const innerGrad = ctx.createRadialGradient(
            dotX - dotR * 0.28,
            dotY - dotR * 0.28,
            2,
            dotX,
            dotY,
            dotR
        );
        innerGrad.addColorStop(0, 'rgba(255, 255, 255, 0.72)');
        innerGrad.addColorStop(0.45, 'rgba(255, 255, 255, 0.16)');
        innerGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = innerGrad;
        ctx.beginPath();
        ctx.arc(dotX, dotY, dotR, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    /* =====================================================================
       MOTOR DE RITMO (PROGRESIVO / ALEATORIO) Y BUCLE PRINCIPAL
    ===================================================================== */
    function rollNextColorThreshold() {
        return 4 + Math.random() * 8; // 4 a 12 segundos
    }

    function evaluatePacing(nowMs) {
        if (inGoldenZone) return;

        const timeInColorSec = (nowMs - colorStartTime) / 1000;
        if (timeInColorSec < nextColorThreshold) return;

        let nextColor = currentColor;
        const rand = Math.random();

        if (config.mode === 'random') {
            if (rand < 0.25) nextColor = 'red';
            else if (rand < 0.50) nextColor = 'green';
            else if (rand < 0.75) nextColor = 'yellow';
            else nextColor = 'purple';
        } else {
            // Modo Progresivo en 4 niveles sobre la duración jugable antes de Gloria
            const playable = Math.max(1, config.totalDuration - GOLDEN_WINDOW_SEC);
            const progress = Math.max(0, Math.min(1, elapsedTime / playable));

            if (progress < 0.25) {
                if (rand < 0.55) nextColor = 'green';
                else if (rand < 0.85) nextColor = 'red';
                else if (rand < 0.95) nextColor = 'yellow';
                else nextColor = 'purple';
            } else if (progress < 0.50) {
                if (rand < 0.45) nextColor = 'green';
                else if (rand < 0.70) nextColor = 'yellow';
                else if (rand < 0.85) nextColor = 'red';
                else nextColor = 'purple';
            } else if (progress < 0.75) {
                if (rand < 0.50) nextColor = 'yellow';
                else if (rand < 0.80) nextColor = 'purple';
                else if (rand < 0.95) nextColor = 'green';
                else nextColor = 'red';
            } else {
                if (rand < 0.50) nextColor = 'purple';
                else if (rand < 0.80) nextColor = 'yellow';
                else if (rand < 0.90) nextColor = 'green';
                else nextColor = 'red';
            }
        }

        // Anti-bloqueo en morado (> 8 segundos fuerza rojo o verde)
        if (currentColor === 'purple' && timeInColorSec > 8) {
            nextColor = Math.random() > 0.5 ? 'red' : 'green';
        }

        colorStartTime = nowMs;
        nextColorThreshold = rollNextColorThreshold();

        if (nextColor !== currentColor) {
            currentColor = nextColor;
            playColorShiftCue(nextColor);
        }
    }

    function updateGoldenState() {
        const remaining = config.totalDuration - elapsedTime;
        const shouldBeGold = remaining <= GOLDEN_WINDOW_SEC && remaining > 0;

        if (shouldBeGold && !inGoldenZone) {
            inGoldenZone = true;
            btnJumpGlory.classList.add('active');
            playColorShiftCue('gold');
        } else if (!shouldBeGold && inGoldenZone) {
            inGoldenZone = false;
            btnJumpGlory.classList.remove('active');
        }
    }

    function updateTimeUI() {
        if (!isSeeking) {
            seekBar.value = elapsedTime.toFixed(1);
        }
        timeReadout.textContent = `${formatMMSS(elapsedTime)} / ${formatMMSS(config.totalDuration)}`;
    }

    function gameLoop(now) {
        if (!sessionActive) return;

        const rawDeltaMs = now - lastFrameTime;
        lastFrameTime = now;

        // Normalización de delta-time para 30Hz / 60Hz / 120Hz
        const dtFrames = Math.min(Math.max(rawDeltaMs / 16.6667, 0), 3);
        const dtSec = Math.min(Math.max(rawDeltaMs / 1000, 0), 0.1);

        if (!isPaused) {
            elapsedTime = Math.min(config.totalDuration, elapsedTime + dtSec);
            updateGoldenState();
            evaluatePacing(now);

            const activeKey = inGoldenZone ? 'gold' : currentColor;
            const speed = COLORS[activeKey].speed;

            dotPosition += speed * dtFrames * dotDirection;
            if (dotPosition >= 100) {
                dotPosition = 100;
                dotDirection = -1;
                playBeatSound(activeKey);
            } else if (dotPosition <= 0) {
                dotPosition = 0;
                dotDirection = 1;
                playBeatSound(activeKey);
            }

            updateTimeUI();

            // Fin exacto al llegar al tiempo personalizado
            if (elapsedTime >= config.totalDuration) {
                renderCanvas(now);
                completeSession();
                return;
            }
        }

        renderCanvas(now);
        animFrameId = requestAnimationFrame(gameLoop);
    }

    /* =====================================================================
       INICIO, PAUSA, SEEK Y REINICIO DE SESIÓN
    ===================================================================== */
    function startSession(autoRecord) {
        initAudioEngine();
        syncCustomDuration(true);

        config.mode = modeSelect.value;
        config.bgMode = bgSelect.value;

        canvasWrapper.classList.toggle('checker-bg', config.bgMode === 'transparent');

        sessionActive = true;
        isPaused = false;
        inGoldenZone = config.totalDuration <= GOLDEN_WINDOW_SEC;
        currentColor = 'green';
        dotPosition = 0;
        dotDirection = 1;
        elapsedTime = 0;
        lastFrameTime = performance.now();
        colorStartTime = lastFrameTime;
        nextColorThreshold = rollNextColorThreshold();

        seekBar.max = config.totalDuration;
        seekBar.value = 0;
        btnPlayPause.innerHTML = ICON_PAUSE;
        btnJumpGlory.classList.toggle('active', inGoldenZone);
        updateTimeUI();

        setupUI.style.display = 'none';
        renderCanvas(lastFrameTime);

        if (autoRecord) {
            startRecording();
        } else {
            updateRecordButtonUI(false);
        }

        cancelAnimationFrame(animFrameId);
        animFrameId = requestAnimationFrame(gameLoop);
        showControls();
    }

    function completeSession() {
        isPaused = true;
        btnPlayPause.innerHTML = ICON_PLAY;
        cancelAnimationFrame(animFrameId);
        animFrameId = null;

        if (isRecording) {
            stopRecording();
        } else {
            clearTimeout(controlsHideTimer);
            controlsDock.classList.add('show');
        }
    }

    function togglePlayPause() {
        if (!sessionActive) return;
        initAudioEngine();

        if (elapsedTime >= config.totalDuration) {
            elapsedTime = 0;
            inGoldenZone = config.totalDuration <= GOLDEN_WINDOW_SEC;
            btnJumpGlory.classList.toggle('active', inGoldenZone);
            colorStartTime = performance.now();
        }

        isPaused = !isPaused;
        if (isPaused) {
            btnPlayPause.innerHTML = ICON_PLAY;
            clearTimeout(controlsHideTimer);
            controlsDock.classList.add('show');
        } else {
            btnPlayPause.innerHTML = ICON_PAUSE;
            lastFrameTime = performance.now();
            if (!animFrameId) {
                animFrameId = requestAnimationFrame(gameLoop);
            }
            showControls();
        }
    }

    function jumpToGoldenZone() {
        if (!sessionActive) return;
        initAudioEngine();
        elapsedTime = Math.max(0, config.totalDuration - GOLDEN_WINDOW_SEC);
        updateGoldenState();
        updateTimeUI();
        renderCanvas(performance.now());
        showControls();
    }

    function toggleMute() {
        initAudioEngine();
        isMuted = !isMuted;
        if (masterGain && audioCtx) {
            masterGain.gain.setTargetAtTime(isMuted ? 0 : 1.0, audioCtx.currentTime, 0.015);
        }
        btnMuteToggle.innerHTML = isMuted ? ICON_VOL_OFF : ICON_VOL_ON;
        btnMuteToggle.classList.toggle('muted', isMuted);
        showControls();
    }

    function returnToMenu() {
        const wasRecording = isRecording;
        sessionActive = false;
        isPaused = false;
        inGoldenZone = false;

        cancelAnimationFrame(animFrameId);
        animFrameId = null;
        clearTimeout(controlsHideTimer);

        controlsDock.classList.remove('show');
        btnJumpGlory.classList.remove('active');

        if (wasRecording) {
            stopRecording();
        } else {
            setupUI.style.display = 'flex';
        }
    }

    /* =====================================================================
       GRABACIÓN Y MODAL DE EXPORTACIÓN INFALIBLE
    ===================================================================== */
    function updateRecordButtonUI(active) {
        btnRecordToggle.classList.toggle('recording', active);
        btnRecordToggle.innerHTML = active ? ICON_REC_STOP : ICON_REC;
        btnRecordToggle.title = active ? 'Detener Grabación y Guardar' : 'Iniciar Grabación';
    }

    function pickBestMimeType() {
        if (!window.MediaRecorder || typeof MediaRecorder.isTypeSupported !== 'function') {
            return '';
        }

        const candidates = config.bgMode === 'transparent'
            ? [
                'video/webm;codecs=vp9,opus',
                'video/webm;codecs=vp8,opus',
                'video/webm'
            ]
            : [
                'video/webm;codecs=vp9,opus',
                'video/mp4;codecs=avc1,mp4a.40.2',
                'video/mp4',
                'video/webm;codecs=vp8,opus',
                'video/webm'
            ];

        return candidates.find((type) => MediaRecorder.isTypeSupported(type)) || '';
    }

    function startRecording() {
        if (isRecording) return;
        initAudioEngine();

        try {
            const videoStream = canvas.captureStream(30);
            const tracks = [...videoStream.getVideoTracks()];

            if (mediaDest && mediaDest.stream) {
                const audioTracks = mediaDest.stream.getAudioTracks();
                if (audioTracks.length > 0) {
                    tracks.push(audioTracks[0]);
                }
            }

            const combinedStream = new MediaStream(tracks);
            const chosenMime = pickBestMimeType();

            recordedChunks = [];
            recordingStartElapsed = elapsedTime;

            const recorderOptions = { videoBitsPerSecond: 6000000 };
            if (chosenMime) {
                recorderOptions.mimeType = chosenMime;
            }

            try {
                mediaRecorder = new MediaRecorder(combinedStream, recorderOptions);
            } catch (err) {
                mediaRecorder = new MediaRecorder(combinedStream);
            }

            currentMimeType = mediaRecorder.mimeType || chosenMime || 'video/webm';

            mediaRecorder.ondataavailable = (event) => {
                if (event.data && event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = () => {
                recordedDurationSec = Math.max(1, elapsedTime - recordingStartElapsed);
                openExportModal();
            };

            mediaRecorder.start(250);
            isRecording = true;
            updateRecordButtonUI(true);
        } catch (err) {
            console.error('Error iniciando MediaRecorder:', err);
            isRecording = false;
            updateRecordButtonUI(false);
        }
    }

    function stopRecording() {
        if (!isRecording || !mediaRecorder) return;
        isRecording = false;
        updateRecordButtonUI(false);

        try {
            if (mediaRecorder.state === 'recording') {
                mediaRecorder.requestData();
            }
            if (mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        } catch (err) {
            console.error('Error deteniendo MediaRecorder:', err);
            openExportModal();
        }
    }

    function revokeExportBlob() {
        if (currentBlobUrl) {
            URL.revokeObjectURL(currentBlobUrl);
            currentBlobUrl = null;
        }
        currentBlob = null;
    }

    function openExportModal() {
        if (!recordedChunks.length) {
            if (!sessionActive) {
                setupUI.style.display = 'flex';
            }
            return;
        }

        revokeExportBlob();

        const isMp4 = currentMimeType.toLowerCase().includes('mp4');
        const ext = isMp4 ? 'mp4' : 'webm';
        const durationLabel = formatFilenameDuration(recordedDurationSec);
        currentFileName = `jerkof-metronome-${durationLabel}.${ext}`;

        currentBlob = new Blob(recordedChunks, { type: currentMimeType });
        currentBlobUrl = URL.createObjectURL(currentBlob);

        const sizeMB = (currentBlob.size / (1024 * 1024)).toFixed(2);
        metaDuration.textContent = formatMMSS(recordedDurationSec);
        metaSize.textContent = `${sizeMB} MB`;

        previewVideo.src = currentBlobUrl;
        exportStatus.textContent = '';
        exportStatus.className = 'export-status';

        // Verificar soporte móvil para compartir/guardar archivo
        let canShareFile = false;
        try {
            const testFile = new File([currentBlob], currentFileName, { type: currentMimeType });
            canShareFile = Boolean(navigator.canShare && navigator.canShare({ files: [testFile] }));
        } catch (e) {
            canShareFile = false;
        }
        btnShareMobile.style.display = canShareFile ? 'flex' : 'none';

        isPaused = true;
        btnPlayPause.innerHTML = ICON_PLAY;
        controlsDock.classList.remove('show');
        exportModal.classList.add('show');
    }

    async function downloadRecordedVideo() {
        if (!currentBlob || !currentBlobUrl) return;
        exportStatus.textContent = '';
        exportStatus.className = 'export-status';

        // Método principal: descarga directa confiable por <a download>
        try {
            const link = document.createElement('a');
            link.style.display = 'none';
            link.href = currentBlobUrl;
            link.download = currentFileName;
            document.body.appendChild(link);
            link.click();
            setTimeout(() => {
                if (link.parentNode) {
                    link.parentNode.removeChild(link);
                }
            }, 1500);
            exportStatus.textContent = `Descargando ${currentFileName}...`;
            return;
        } catch (err) {
            // Respaldo con File System Access API si el navegador bloqueó el click programático
        }

        if (typeof window.showSaveFilePicker === 'function') {
            try {
                const isMp4 = currentFileName.endsWith('.mp4');
                const handle = await window.showSaveFilePicker({
                    suggestedName: currentFileName,
                    types: [{
                        description: 'Video Overlay Metrónomo',
                        accept: { [currentMimeType]: [isMp4 ? '.mp4' : '.webm'] }
                    }]
                });
                const writable = await handle.createWritable();
                await writable.write(currentBlob);
                await writable.close();
                exportStatus.textContent = 'Archivo guardado correctamente.';
            } catch (err) {
                if (err && err.name !== 'AbortError') {
                    exportStatus.className = 'export-status warn';
                    exportStatus.textContent = 'Usa "Compartir / Guardar en Móvil" o el menú del reproductor.';
                }
            }
        }
    }

    async function shareRecordedVideo() {
        if (!currentBlob) return;
        try {
            const file = new File([currentBlob], currentFileName, { type: currentMimeType });
            if (navigator.share) {
                await navigator.share({
                    files: [file],
                    title: 'JERKOF Metrónomo 1920×180'
                });
                exportStatus.textContent = 'Archivo guardado / compartido.';
            }
        } catch (err) {
            if (err && err.name !== 'AbortError') {
                exportStatus.className = 'export-status warn';
                exportStatus.textContent = 'No se pudo abrir el menú de compartir.';
            }
        }
    }

    function closeExportAndReset() {
        previewVideo.pause();
        previewVideo.removeAttribute('src');
        previewVideo.load();
        revokeExportBlob();

        exportModal.classList.remove('show');
        sessionActive = false;
        isPaused = false;
        inGoldenZone = false;
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
        clearTimeout(controlsHideTimer);

        controlsDock.classList.remove('show');
        setupUI.style.display = 'flex';
    }

    /* =====================================================================
       VISIBILIDAD AUTO-OCULTABLE DE CONTROLES
    ===================================================================== */
    function showControls() {
        if (!sessionActive || exportModal.classList.contains('show')) return;
        controlsDock.classList.add('show');
        clearTimeout(controlsHideTimer);

        controlsHideTimer = setTimeout(() => {
            if (!isPaused && !isSeeking) {
                controlsDock.classList.remove('show');
            }
        }, 3000);
    }

    /* =====================================================================
       EVENTOS DE INTERFAZ Y SEEK BAR
    ===================================================================== */
    document.getElementById('btnStartSession').addEventListener('click', () => startSession(false));
    document.getElementById('btnStartAndRecord').addEventListener('click', () => startSession(true));

    stageContainer.addEventListener('click', () => {
        if (sessionActive) showControls();
    });

    stageContainer.addEventListener('mousemove', () => {
        if (sessionActive) showControls();
    });

    stageContainer.addEventListener('touchstart', () => {
        if (sessionActive) showControls();
    }, { passive: true });

    controlsDock.addEventListener('click', (e) => e.stopPropagation());

    seekBar.addEventListener('input', () => {
        isSeeking = true;
        clearTimeout(controlsHideTimer);
        elapsedTime = parseFloat(seekBar.value) || 0;
        timeReadout.textContent = `${formatMMSS(elapsedTime)} / ${formatMMSS(config.totalDuration)}`;
    });

    seekBar.addEventListener('change', () => {
        elapsedTime = parseFloat(seekBar.value) || 0;
        isSeeking = false;
        updateGoldenState();
        renderCanvas(performance.now());
        showControls();
    });

    btnReturnMenu.addEventListener('click', returnToMenu);
    btnPlayPause.addEventListener('click', togglePlayPause);
    btnJumpGlory.addEventListener('click', jumpToGoldenZone);
    btnMuteToggle.addEventListener('click', toggleMute);

    btnRecordToggle.addEventListener('click', () => {
        if (!sessionActive) return;
        if (isRecording) {
            stopRecording();
        } else {
            startRecording();
            showControls();
        }
    });

    btnDownloadFile.addEventListener('click', downloadRecordedVideo);
    btnShareMobile.addEventListener('click', shareRecordedVideo);
    btnCloseExport.addEventListener('click', closeExportAndReset);

    /* =====================================================================
       INICIALIZACIÓN INICIAL
    ===================================================================== */
    syncCustomDuration(true);
    renderCanvas(performance.now());
</script>
</body>
</html>
